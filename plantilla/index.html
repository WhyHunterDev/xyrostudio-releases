<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi negocio</title>
<meta name="description" content="">
<meta name="theme-color" content="#111827">
<!-- Plantilla XyroStudio: se conecta sola al Panel XyroStudio (métricas, errores, temas, mantenimiento, copias). -->
<style>
:root{--c:#7c5cff;--tx:#111;--mu:#666;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);background:var(--bg)}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--c);color:#fff;font-weight:700}
.hero{padding:56px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,#fff),#fff)}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin-bottom:10px}
.sub{color:var(--mu);max-width:560px;margin-bottom:20px}
.btn{display:inline-block;padding:12px 18px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;text-decoration:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:30px 20px}
.it{border:1px solid #eee;border-radius:14px;padding:16px;display:grid;gap:6px}
.it i{font-style:normal;font-size:28px}.it b{font-size:18px}
.promo{display:none;padding:10px 20px;text-align:center;font-weight:700;background:#111;color:#fff}
[data-tema] .promo{display:block}
footer{padding:30px 20px;color:var(--mu);font-size:14px;text-align:center}
#manto{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#0b0b12;color:#fff;z-index:9}
#manto p{color:#aaa;margin-top:8px}
</style>
</head>
<body>
<div class="promo" id="promo"></div>
<header class="top"><span data-k="nombre">Mi negocio</span></header>
<section class="hero"><div class="wrap">
  <h1 data-k="titulo">Título de la web</h1>
  <p class="sub" data-k="sub">Una frase que explique qué ofreces.</p>
  <a class="btn" id="wa" href="#" target="_blank" rel="noopener"><span data-k="cta">Escríbenos por WhatsApp</span></a>
</div></section>
<section class="wrap items" id="items"></section>
<footer>© <span id="anio"></span> <span data-k="nombre"></span> · Hecho por <a href="https://xyrostudio.net" rel="noopener">XyroStudio</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="backend/conexion.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  $('#anio').textContent = new Date().getFullYear();
  // Contenido por defecto (el panel lo reemplaza al guardar).
  let d = { config: {}, negocio: { nombre: 'Mi negocio', titulo: 'Título de la web', sub: 'Una frase que explique qué ofreces.', cta: 'Escríbenos por WhatsApp', whatsapp: '', color: '#7c5cff' }, items: [] };
  const BK = window.SS_BACKEND;
  if (BK) { try { const n = await BK.cargar(); d = { ...d, ...n, negocio: { ...d.negocio, ...(n.negocio || {}) } }; } catch (e) { BK.reportarError('No cargó el contenido', e && e.message); } }
  const c = d.config || {}, n = d.negocio;

  // Modo mantenimiento (se activa desde el Panel XyroStudio).
  if (c.mantenimiento) {
    const m = c.manto || {}; document.title = 'En mantenimiento';
    document.body.insertAdjacentHTML('beforeend', `<div id="manto"><div><h1>${esc(m.titulo || 'Estamos mejorando la web')}</h1><p>${esc(m.msg || 'Volvemos en un momento. ¡Gracias por tu paciencia!')}</p></div></div>`);
    return;
  }
  // Textos y color
  document.title = n.nombre; document.documentElement.style.setProperty('--c', n.color || '#7c5cff');
  document.querySelectorAll('[data-k]').forEach((el) => { if (n[el.dataset.k]) el.textContent = n[el.dataset.k]; });
  const num = String(n.whatsapp || '').replace(/\D/g, '');
  $('#wa').href = num ? 'https://wa.me/' + num : '#'; if (!num) $('#wa').hidden = true;
  $('#items').innerHTML = (d.items || []).map((x) => `<div class="it"><i>${esc(x.emo)}</i><span>${esc(x.nombre)}</span>${x.precio ? `<b>S/ ${(+x.precio).toFixed(2)}</b>` : ''}</div>`).join('');
  // Tema de temporada + promo con cuenta regresiva (lo activa el Panel XyroStudio).
  const TEMAS = { navidad: '🎄', halloween: '🎃', anionuevo: '🎆', fiestaspatrias: '🇵🇪', sanvalentin: '❤️' };
  if (TEMAS[c.tema]) {
    document.documentElement.dataset.tema = c.tema;
    const dias = c.temaHasta ? Math.ceil((new Date(c.temaHasta + 'T23:59:59') - Date.now()) / 864e5) : 0;
    $('#promo').textContent = `${TEMAS[c.tema]} ${c.temaTitulo || ''} ${c.temaPromo || ''}${dias > 0 ? ` · quedan ${dias} días` : ''}`.trim();
  }
  // Métricas para el panel: visitas (1 por sesión) y clics a WhatsApp.
  if (BK) {
    try { if (!sessionStorage.getItem('v')) { sessionStorage.setItem('v', 1); BK.metrica('visita'); } } catch (_) {}
    document.addEventListener('click', (e) => { const a = e.target.closest('a'); if (a && /wa\.me/.test(a.href)) BK.metrica('whatsapp'); });
  }
})();
</script>
</body>
</html>
