<style>
*{scrollbar-width:thin;scrollbar-color:#34344a transparent}
:root{--bg:#06060b;--bg2:#0b0b12;--card:#101019;--card2:#13131f;--line:#20202e;--line2:#2b2b3d;--ac:#7c5cff;--ac2:#3ad6ff;--tx:#eef0f6;--mu:#8b8ba3;--ok:#00e6a8;--warn:#ffb020;--bad:#ff5a6a;--f:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--glow:0 0 0 1px rgba(124,108,255,.0),0 18px 50px -20px rgba(124,108,255,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--f);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60vw 60vw at 12% -8%,rgba(124,108,255,.22),transparent 60%),radial-gradient(50vw 50vw at 100% 0,rgba(0,230,168,.14),transparent 55%),radial-gradient(40vw 40vw at 80% 100%,rgba(124,108,255,.1),transparent 60%);animation:mesh 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:44px 44px;mask:radial-gradient(circle at 50% 30%,#000,transparent 85%)}
@keyframes mesh{to{transform:translate3d(0,0,0) scale(1.15) rotate(4deg)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;background:rgba(8,8,14,.7);border:1px solid var(--line);border-radius:11px;padding:.7rem .85rem;outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
label{display:grid;gap:.3rem;font-size:.76rem;font-weight:600;color:var(--mu);letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.65rem 1.1rem;border-radius:11px;font-weight:650;font-size:.88rem;transition:transform .12s,filter .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-p{background:linear-gradient(135deg,var(--ac),#9d7bff);color:#fff;box-shadow:0 10px 26px -10px rgba(124,108,255,.8)}.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:rgba(255,255,255,.04);border:1px solid var(--line)}.btn-g:hover{border-color:var(--line2);background:rgba(255,255,255,.07)}
.btn-sm{padding:.4rem .7rem;font-size:.78rem;border-radius:8px}
.btn-bad{background:rgba(255,90,106,.12);color:var(--bad)}
.btn-ok{background:rgba(0,230,168,.12);color:var(--ok)}
.btn:disabled{opacity:.5;cursor:wait}
.link{color:var(--ac);font-size:.82rem;text-align:center;background:none}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login form{width:min(410px,100%);display:grid;gap:1rem;background:rgba(12,12,20,.72);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:24px;padding:36px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:#07070b;box-shadow:0 10px 30px -8px rgba(124,108,255,.7)}
.err{color:var(--bad);font-size:.84rem}
.ok-msg{color:var(--ok);font-size:.84rem}
.lock{display:flex;gap:.4rem;align-items:center;color:var(--mu);font-size:.72rem}
#app{display:none;grid-template-columns:234px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,rgba(13,13,21,.9),rgba(9,9,15,.9));backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:.55rem;align-items:center;padding:6px 8px 4px;font-weight:700}
.brand .logo{width:36px;height:36px;font-size:1.1rem;border-radius:11px}
.brand b{color:var(--ac2)}
.status{display:flex;align-items:center;gap:.4rem;font-size:.68rem;color:var(--mu);padding:2px 10px 16px;font-family:var(--mono)}
.status .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(0,230,168,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,168,.5)}70%{box-shadow:0 0 0 7px rgba(0,230,168,0)}100%{box-shadow:0 0 0 0 rgba(0,230,168,0)}}
.grp{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#56566e;padding:14px 12px 5px}
.nv{display:flex;gap:.65rem;align-items:center;padding:.62rem .8rem;border-radius:10px;color:var(--mu);font-weight:600;font-size:.87rem;transition:.15s;text-align:left;width:100%;position:relative}
.nv:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nv.on{background:linear-gradient(135deg,rgba(124,108,255,.26),rgba(0,230,168,.08));color:#fff}
.nv.on::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2))}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.84rem}
.me small{color:var(--mu);display:block;margin-bottom:10px}
main{padding:24px clamp(16px,3vw,40px) 80px;min-width:0;max-width:1220px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.95rem;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.sub{color:var(--mu);margin:4px 0 0;font-size:.92rem}
.livechip{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.72rem;color:var(--mu);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:.4rem .7rem}
.livechip .d{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:17px;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ac),#a08bff)}
.kpi.g::before{background:linear-gradient(var(--ac2),#4df0c3)}.kpi.w::before{background:linear-gradient(var(--warn),#ffd36b)}
.kpi b{display:block;font-family:var(--mono);font-size:1.9rem;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.kpi small{color:var(--mu);font-size:.78rem}
.panel{background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:16px;transition:.2s}
.panel:hover{border-color:var(--line2)}
.panel>h3{font-size:1rem;margin-bottom:3px;display:flex;align-items:center;gap:.5rem}
.panel>p.d{color:var(--mu);font-size:.84rem;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form .full{grid-column:1/-1}
.clients{display:grid;gap:12px}
.cl{background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:15px;padding:15px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;transition:.18s}
.cl:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 14px 34px -22px rgba(124,108,255,.6)}
.cl .in{min-width:0}
.cl h4{font-size:1.05rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.cl .meta{color:var(--mu);font-size:.8rem;margin-top:4px;display:flex;gap:.8rem;flex-wrap:wrap;font-family:var(--mono)}
.cl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.63rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;background:#222233}
.tag.activo{background:rgba(0,230,168,.16);color:var(--ok)}.tag.soporte{background:rgba(124,108,255,.18);color:#b9adff}.tag.pausado{background:rgba(255,176,32,.16);color:var(--warn)}.tag.baja{background:rgba(255,90,106,.14);color:var(--bad)}
.tag.pg{background:rgba(0,230,168,.16);color:var(--ok)}.tag.pend{background:rgba(255,176,32,.16);color:var(--warn)}
.tag.x{background:linear-gradient(135deg,rgba(124,108,255,.25),rgba(0,230,168,.2));color:#d7d0ff}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.tbl{overflow-x:auto}
.ver{display:flex;gap:12px;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.ver .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.ver.now .dot{background:var(--ac2);box-shadow:0 0 0 4px rgba(0,230,168,.18)}
.ver .vi{flex:1;min-width:0}.ver small{color:var(--mu);font-family:var(--mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.chip{padding:.4rem .8rem;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--mu);font-size:.82rem;font-weight:600;transition:.15s}
.chip:hover{color:var(--tx);border-color:var(--line2)}
.chip.on{background:var(--ac);color:#fff;border-color:transparent}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tema{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-weight:600;font-size:.86rem;transition:.15s;text-align:left}
.tema:hover{border-color:var(--ac);transform:translateY(-2px);background:rgba(124,108,255,.1)}
.tema b{font-size:1.2rem;line-height:1}
.clavebox{background:rgba(0,230,168,.08);border:1px solid rgba(0,230,168,.35);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:8px;font-size:.88rem}.clavebox .cv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.clavebox code{font-family:var(--mono);font-size:1.05rem;background:rgba(0,0,0,.4);padding:.45rem .7rem;border-radius:9px;color:var(--ok);letter-spacing:.04em}.clavebox small{color:var(--mu)}
.uso-grid{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:18px}@media(max-width:760px){.uso-grid{grid-template-columns:1fr}}.uso-grid h4{font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}.uso-bar{display:flex;justify-content:space-between;padding:.45rem .7rem;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.86rem}.uso-bar b{font-family:var(--mono);color:var(--ac2)}.uso-list{display:grid;gap:6px;font-size:.84rem;max-height:340px;overflow:auto}.uso-list small{color:var(--mu);font-family:var(--mono);font-size:.72rem}.err{border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:rgba(255,90,106,.04)}.err summary{cursor:pointer;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.err pre{white-space:pre-wrap;font-family:var(--mono);font-size:.72rem;color:#cbd;margin-top:8px;max-height:220px;overflow:auto}
.bk-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bk-kpi{background:#0e0e12;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:140px}.bk-kpi small{color:var(--mu);font-size:.78rem}.bk-kpi b{display:block;font-size:1.6rem;font-weight:800;font-family:var(--mono)}.bk-list{display:grid;gap:10px}.bk-cli{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);overflow:hidden}.bk-cli[open]{border-color:var(--line2);background:rgba(124,108,255,.04)}.bk-cli summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}.bk-cli summary::-webkit-details-marker{display:none}.bk-av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#07070b;flex:none}.bk-info{flex:1;min-width:0;display:grid}.bk-info small{color:var(--mu);font-size:.78rem}.bk-cli .tbl{padding:0 14px 12px}
.bks-list{display:grid;gap:10px}.bks{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:rgba(255,176,32,.03)}.bks.igual{background:rgba(255,255,255,.015);border-color:var(--line);opacity:.85}.bks-h{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--tx);font-size:.9rem}.bks-h input{width:18px;height:18px;flex:none;accent-color:var(--ac)}.bks-ico{font-size:1.2rem}.bks-t{flex:1;display:grid}.bks-t small{color:var(--mu);font-weight:500}.bks-d{margin-top:10px}.bks-d summary{cursor:pointer;color:var(--ac);font-size:.82rem;font-weight:600}.bkd{list-style:none;display:grid;gap:8px;margin-top:8px;font-size:.84rem}.bkd li{padding:8px 10px;border-radius:10px;border:1px solid var(--line)}.bkd-add{border-left:3px solid var(--ok)!important}.bkd-del{border-left:3px solid var(--bad)!important}.bkd-mod{border-left:3px solid var(--warn)!important}.bkd-campos{display:grid;gap:6px;margin-top:6px}.bkd-campos div{display:grid;grid-template-columns:minmax(120px,200px) 1fr 1fr;gap:8px;align-items:start;font-size:.78rem}@media(max-width:700px){.bkd-campos div{grid-template-columns:1fr}}.bkd-campos code{font-family:var(--mono);color:var(--mu);word-break:break-all}.bkd-hoy{color:#ffb3bb;word-break:break-word}.bkd-cp{color:#9ff3d6;word-break:break-word}.bks-json{width:100%;min-height:220px;font-family:var(--mono);font-size:.76rem;line-height:1.45;white-space:pre}.bks-safe{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--tx);font-size:.86rem}.bks-safe input{width:18px;height:18px;accent-color:var(--ac)}
.note{background:rgba(124,108,255,.08);border:1px solid rgba(124,108,255,.25);color:#cfc7ff;border-radius:12px;padding:.8rem 1rem;font-size:.85rem;margin-bottom:16px;display:flex;gap:.6rem;align-items:flex-start}
.sw{position:relative;width:42px;height:24px;border-radius:999px;background:#333;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac2)}.sw.on::after{left:21px}
.row-sw{display:flex;align-items:center;gap:.7rem;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,var(--ac),#9d7bff);color:#fff;font-weight:650;padding:.75rem 1.2rem;border-radius:12px;transition:transform .35s;z-index:99;max-width:90vw;box-shadow:0 18px 40px -14px rgba(124,108,255,.8)}
.toast.on{transform:translateX(-50%)}
.fhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(120% 140% at 0% 0%,rgba(124,108,255,.16),transparent 60%),var(--card);margin-bottom:12px}
.fav{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,var(--ac),#9d7bff);box-shadow:0 10px 26px -10px rgba(124,108,255,.8);flex:none}
.fti{flex:1;min-width:200px}.fti h2{font-size:1.25rem;line-height:1.2}.fti small{color:var(--mu);font-size:.82rem}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fchip{font-size:.72rem;font-weight:700;padding:.25rem .6rem;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.facts{display:flex;gap:8px;flex-wrap:wrap}.facts a{color:var(--tx);text-decoration:none}
.ftabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:rgba(11,11,18,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:none;padding:.55rem .9rem;border-radius:10px;font-size:.84rem;font-weight:600;color:var(--mu);white-space:nowrap;transition:.15s}
.ftabs button:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.ftabs button.on{color:#fff;background:linear-gradient(135deg,var(--ac),#9d7bff);box-shadow:0 8px 20px -10px rgba(124,108,255,.9)}
.ftabs i{font-style:normal;font-family:var(--mono);font-size:.7rem;background:rgba(255,255,255,.12);padding:.05rem .4rem;border-radius:99px;margin-left:2px}
.fbody .ftab{display:none;animation:fIn .25s ease}
.fbody[data-cur="xyros"] [data-ft="xyros"],.fbody[data-cur="resumen"] [data-ft="resumen"],.fbody[data-cur="datos"] [data-ft="datos"],.fbody[data-cur="tema"] [data-ft="tema"],.fbody[data-cur="manto"] [data-ft="manto"],.fbody[data-cur="cuentas"] [data-ft="cuentas"],.fbody[data-cur="uso"] [data-ft="uso"],.fbody[data-cur="versiones"] [data-ft="versiones"]{display:block}
@keyframes fIn{from{opacity:0;transform:translateY(6px)}}
.back{color:var(--mu);font-size:.85rem;margin-bottom:12px;display:inline-flex;gap:.4rem;cursor:pointer}
.menuBtn{display:none}
.empty{color:var(--mu);text-align:center;padding:30px}
.center{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mu)}

  #app{grid-template-columns:1fr}

  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
  .menuBtn{display:inline-flex}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .form{grid-template-columns:1fr}
  .cl{grid-template-columns:1fr}.cl .acts{justify-content:flex-start}
}
.xlogo{background:none!important;padding:0;object-fit:contain}
.xy-grid{display:grid;gap:10px}.xy{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}.xy.on{border-color:color-mix(in srgb,var(--ac) 55%,transparent);background:rgba(124,92,255,.06)}.xy img{width:44px;height:44px;border-radius:12px}.xy small{color:var(--mu);font-size:.78rem;display:block}.xy .xp{display:flex;gap:8px;align-items:center}.xy .xp input{width:90px}.xy-tot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.xy-tot b{font-family:var(--mono);font-size:1.3rem;color:var(--ac2)}@media(max-width:600px){.xy{grid-template-columns:40px 1fr}.xy .xp{grid-column:1/-1}}

/* Fondo y colores de xyrostudio.net: negro azulado con red de partículas morada; tarjetas sólidas sin degradados. */
:root{--bg:#05060a;--bg2:#0b0d14;--card:#10131c;--card2:#171b27;--line:#ffffff14;--line2:#ffffff24;--mu:#9aa1b5;--ac:#7c5cff}
#fx{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.aura{position:fixed;width:70vmax;height:70vmax;left:50%;top:50%;transform:translate(-50%,-60%);border-radius:50%;background:radial-gradient(closest-side,#7c5cff33,transparent);filter:blur(20px);z-index:-1;pointer-events:none}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px circle at var(--mx,50%) var(--my,40%),#7c5cff2e,transparent 60%)}
a.btn{color:var(--tx)}
body::before,body::after{display:none}
aside{background:#0b0d14e6;backdrop-filter:blur(12px)}
.btn-p,.toast,.ftabs button.on{background:var(--ac);box-shadow:none}
.nv.on{background:var(--ac);color:#fff}.nv.on::before{display:none}
.kpi,.panel,.cl,.fhead{background:#10131cd9;backdrop-filter:blur(6px)}
.kpi::before,.kpi.g::before,.kpi.w::before{display:none}
.tag.x{background:#ffffff12;color:var(--tx)}
.logo,.bk-av,.fav{background:var(--ac)}
.xy.on{background:#7c5cff14}
</style>
</head>
<body><canvas id="fx" aria-hidden="true"></canvas><div class="aura"></div><div class="glow"></div>
<section id="login">
  <form id="lf" autocomplete="on">
    <img class="logo xlogo" src="../img/marca/logo-xyrostudio-app.svg" alt="XyroStudio" width="52" height="52">
    <div><h1 style="font-size:1.5rem">Xyro<b style="background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent">Studio</b> Panel</h1><p style="color:var(--mu);font-size:.88rem">Panel interno de XyroStudio · acceso privado.</p></div>
    <label>Correo<input id="em" type="email" required autocomplete="username"></label>
    <label>Contraseña<input id="pw" type="password" required autocomplete="current-password"></label>
    <p class="err" id="err" hidden></p>
    <p class="ok-msg" id="okm" hidden></p>
    <button class="btn btn-p" type="submit" id="lbtn">Entrar</button>
    <button type="button" class="link" id="forgot">¿Olvidaste tu contraseña?</button>
    <p class="lock">🔒 Acceso cifrado con Supabase · recuperación por correo</p>
  </form>
</section>

<section id="loading" class="center" style="display:none">Conectando…</section>
<section id="nocfg" class="center" style="display:none">⚠️ Falta configurar la conexión a la base de datos (backend/conexion.js).</section>

<div id="app">
  <aside id="side"></aside>
  <main>
    <div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-g btn-sm menuBtn" id="mb">☰</button><div id="h"></div></div><div id="acts"></div></div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="backend/conexion.js?v=11"></script>
<script>
(function () {
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles=n=>'S/ '+(+n||0).toLocaleString('es-PE');
const fecha=t=>t?new Date(t).toLocaleString('es-PE',{dateStyle:'medium',timeStyle:'short'}):'';
const toast=m=>{ if(/row-level security|permission denied for|jwt|not authenticated/i.test(String(m))){ m='Se venció tu sesión. Renovándola… vuelve a intentarlo.'; (async()=>{ try{ const {data}=await sb.auth.getSession(); if(!data||!data.session) sesionPerdida(); else await sb.auth.refreshSession(); }catch(_){ sesionPerdida(); } })(); }
  const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600);};
const show=id=>['login','loading','nocfg','app'].forEach(s=>{const el=$('#'+s);el.style.display=s===id?(s==='app'?'grid':(s==='login'?'':'grid')):'none';});

// Sin backend configurado → avisa y detente.
if (!window.SS_BACKEND) { show('nocfg'); return; }
const sb = window.SS_BACKEND.sb, AUTH = window.SS_BACKEND.auth;

// ---- Accesos por rol ----
// Hoy solo entra el dueño (rol 'gestor' = acceso total). Para sumar equipo después,
// agrega aquí el rol con sus secciones y crea su política RLS en Supabase. Ej.:
//   soporte:['resumen','clientes','soporte','backups'],  vendedor:['resumen','clientes']
const ACCESO={ gestor:'*' };
const ROL_NOMBRE={ gestor:'Dueño', soporte:'Soporte', vendedor:'Ventas' };
const puede=(v,rol=me&&me.rol)=>{ const a=ACCESO[rol]; return a==='*'||(Array.isArray(a)&&a.includes(v)); };
let me=null, clientes=[], view='resumen', editing=null, recovery=false, fichaTab='resumen', fichaInfo=null;
const CFG='gestor-cfg', LOG='gestor-log';
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG))||{soporteSinRegistro:true};}catch(_){return{soporteSinRegistro:true};}};
const setCfg=o=>{try{localStorage.setItem(CFG,JSON.stringify(o));}catch(_){}}
const logGet=()=>{try{return JSON.parse(localStorage.getItem(LOG))||[];}catch(_){return[];}};
const touch=m=>{try{const l=logGet();l.unshift({t:Date.now(),m});localStorage.setItem(LOG,JSON.stringify(l.slice(0,200)));}catch(_){}}

// ---- Clientes (tabla clientes_agencia en la nube) ----
async function cargar(){ const {data,error}=await sb.from('clientes_agencia').select('*').order('creado',{ascending:true}); if(error)throw error; clientes=data||[]; }
async function guardar(c){ const {error}=await sb.from('clientes_agencia').upsert(c); if(error)throw error; }
async function borrar(id){ const {error}=await sb.from('clientes_agencia').delete().eq('id',id); if(error)throw error; }

// ---- Xyros (divisiones que el cliente puede tener) ----
// Activos -> config.xyros del sitio (la plataforma del cliente lo lee para ofrecer mejoras).
// Precios -> clientes_agencia.modulos (privado, solo tú). Requiere 14-xyros.sql.
const XYROS=[['webs','Xyro Webs','Web y panel editable'],['apps','Xyro Apps','Clientes, membresías y cobros'],['control','Xyro Control','Caja, inventario y reportes'],['bots','Xyro Bots','WhatsApp que atiende y vende'],['edits','Xyro Edits','Reels y videos con IA']];
const modsDe=(cl,cf)=>{ const m=structuredClone(cl.modulos||{}); const act=(cf&&cf.xyros)||(cl.url?['webs']:[]); XYROS.forEach(([k])=>{ m[k]=m[k]||{}; if(m[k].on===undefined)m[k].on=act.includes(k); if(k==='webs'&&m[k].precio==null&&m[k].on)m[k].precio=+cl.soporte||0; }); return m; };
const mensualDe=c=>{ const m=c.modulos; if(m&&Object.keys(m).length) return Object.values(m).reduce((a,x)=>a+(x&&x.on?(+x.precio||0):0),0); return c.ciclo==='mensual'?(+c.soporte||0):0; };
function xyrosPanel(cl,cf,slug){
  const m=modsDe(cl,cf), tot=Object.values(m).reduce((a,x)=>a+(x.on?(+x.precio||0):0),0);
  return `<div class="panel"><h3>Xyros del cliente <span class="tag x">Suscripción</span></h3><p class="d">Activa cada división que el cliente contrata y su mensualidad. Las que no tenga le aparecen en su panel como mejora.</p>
    <div class="xy-grid">${XYROS.map(([k,n,d])=>`<div class="xy ${m[k].on?'on':''}"><img src="../img/marca/logo-${k}-app.svg" alt=""><div><b>${n}</b><small>${d}</small>${k==='apps'&&slug?`<a href="../app/?s=${encodeURIComponent(slug)}" target="_blank" rel="noopener" style="color:var(--ok);font-size:12px;font-weight:700">Abrir Xyro Apps ↗</a>`:''}</div><div class="xp"><input type="number" min="0" step="any" placeholder="S/ mes" data-xyp="${k}" value="${m[k].precio??''}"><button class="tema${m[k].on?' save':''}" data-xyt="${k}" style="${m[k].on?'border-color:var(--ok);color:var(--ok)':''}">${m[k].on?'✅ Activo':'➕ Activar'}</button></div></div>`).join('')}</div>
    <div class="xy-tot"><span>Mensualidad total</span><b id="xyTot">${soles(tot)}</b></div>
    <button class="btn btn-p" data-xysave="${esc(cl.id)}" data-slug="${esc(slug||'')}" style="margin-top:12px">💾 Guardar Xyros</button></div>`;
}
async function guardarXyros(id,slug){
  const cl=clientes.find(c=>c.id==id), m={};
  $$('[data-xyt]').forEach(b=>{ const k=b.dataset.xyt, v=$(`[data-xyp="${k}"]`).value; m[k]={on:b.classList.contains('save'),precio:v===''?null:+v}; });
  const {error}=await sb.from('clientes_agencia').update({modulos:m}).eq('id',id);
  if(error){ if(/modulos|column|schema cache/i.test(error.message)) throw new Error('Corre 14-xyros.sql en Supabase para guardar los Xyros.'); throw error; }
  if(slug) await guardarPromo(slug,{xyros:XYROS.map(([k])=>k).filter(k=>m[k].on)});
  touch(`Actualizó los Xyros de ${cl?cl.negocio:'un cliente'}`);
}

function xyTot(){ const t=$$('[data-xyt]').reduce((a,b)=>a+(b.classList.contains('save')?(+$(`[data-xyp="${b.dataset.xyt}"]`).value||0):0),0); const o=$('#xyTot'); if(o)o.textContent=soles(t); }
document.addEventListener('input',e=>{ if(e.target.dataset&&e.target.dataset.xyp)xyTot(); });

// ---- Temas de temporada (aplica a la web del cliente) ----
const TEMAS=[['','Normal','✨'],['navidad','Navidad','🎄'],['halloween','Halloween','🎃'],['anionuevo','Año Nuevo','🎆'],['fiestaspatrias','Fiestas Patrias','🎊'],['sanvalentin','San Valentín','❤️']];
// Slug del proyecto: último tramo de la ruta (…/santos-strength/) o, si la web está en la raíz, el subdominio/dominio (panaderia.xyrostudio.net → panaderia).
const slugDe=url=>{try{const u=new URL(url),p=u.pathname.split('/').filter(Boolean).filter(x=>!/\.html?$/i.test(x));if(p.length)return p[p.length-1];const h=u.hostname.split('.').filter(x=>x!=='www');return h[0]||'';}catch(_){return '';}};
// Conecta un proyecto nuevo: crea su fila en 'sitios' si aún no existe (requiere 13-nuevos-proyectos.sql).
async function asegurarSitio(c){
  const slug=slugDe(c.url||''); if(!slug)return;
  const {data:s}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(s)return;
  const {error}=await sb.from('sitios').insert({slug,negocio:c.negocio||slug});
  if(error){ toast('Cliente guardado, pero falta conectar «'+slug+'»: corre 13-nuevos-proyectos.sql en Supabase.'); throw Object.assign(new Error(''),{silencio:1}); }
  touch(`Conectó el proyecto «${slug}»`); toast('Proyecto «'+slug+'» conectado ✓');
}
async function aplicarTema(slug,tema){
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)throw new Error('No encuentro el sitio «'+slug+'». Revisa la URL de la web.');
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  const conf=(c&&c.valor)||{}; conf.tema=tema;
  const {error:e2}=await sb.from('contenido').upsert({sitio_id:s.id,clave:'config',valor:conf}); if(e2)throw e2;
}
async function guardarPromo(slug,promo){
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)throw new Error('No encuentro el sitio «'+slug+'». Revisa la URL de la web.');
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  const conf=(c&&c.valor)||{}; Object.assign(conf,promo);
  const {error:e2}=await sb.from('contenido').upsert({sitio_id:s.id,clave:'config',valor:conf}); if(e2)throw e2;
}
async function setExtra(slug,on){
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)throw new Error('No encuentro el sitio «'+slug+'». Revisa la URL de la web.');
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  const conf=(c&&c.valor)||{}; conf.temaExtra=on;
  const {error:e2}=await sb.from('contenido').upsert({sitio_id:s.id,clave:'config',valor:conf}); if(e2)throw e2;
}
async function toggleTemaPermitido(slug,tema){
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)throw new Error('No encuentro el sitio «'+slug+'». Revisa la URL de la web.');
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  const conf=(c&&c.valor)||{}; const arr=new Set(conf.temasPermitidos||[]);
  const ahora=arr.has(tema); if(ahora)arr.delete(tema); else arr.add(tema);
  conf.temasPermitidos=[...arr]; conf.temaExtra=conf.temasPermitidos.length>0;
  const {error:e2}=await sb.from('contenido').upsert({sitio_id:s.id,clave:'config',valor:conf}); if(e2)throw e2;
  return !ahora;
}
async function setMantenimiento(slug,on,titulo,msg){
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)throw new Error('No encuentro el sitio «'+slug+'». Revisa la URL de la web.');
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  const conf=(c&&c.valor)||{}; conf.mantenimiento=on; conf.manto={titulo:titulo||'',msg:msg||''};
  const {error:e2}=await sb.from('contenido').upsert({sitio_id:s.id,clave:'config',valor:conf}); if(e2)throw e2;
}

// ---- Login / seguridad ----
$('#lf').addEventListener('submit', async e=>{
  e.preventDefault(); const err=$('#err'),okm=$('#okm'); err.hidden=true; okm.hidden=true;
  const email=$('#em').value.trim(), pass=$('#pw').value;
  $('#lbtn').disabled=true;
  // Bloqueo progresivo por correo/IP (SQL 23); si el SQL no está, entra normal.
  const em=email.toLowerCase().slice(0,120), rpcN=async(n,a)=>{ try{ const {data,error}=await sb.rpc(n,a); return error?0:(data|0); }catch(_){ return 0; } };
  const espera=await rpcN('xa_login_espera',{p_email:em});
  if(espera>0){ err.textContent=`🔒 Por seguridad, espera ${espera>=90?Math.ceil(espera/60)+' min':espera+' s'} antes de volver a intentar.`; err.hidden=false; setTimeout(()=>{$('#lbtn').disabled=false;},Math.min(espera,60)*1000); return; }
  try{
    let perfil; try{ perfil=await AUTH.entrar(email,pass); }catch(x){ await rpcN('xa_login_fallo',{p_email:em,p_ua:'Panel XyroStudio · '+navigator.userAgent.slice(0,160)}); throw x; } sesionPerdida.on=false;
    if(!perfil||!ACCESO[perfil.rol]){ await AUTH.salir(); await rpcN('xa_login_fallo',{p_email:em,p_ua:'Panel XyroStudio · cuenta sin acceso'}); throw new Error('Esta cuenta no tiene acceso al panel de XyroStudio.'); }
    me={id:perfil.id,nombre:perfil.nombre||'Gestor',email,rol:perfil.rol};
    $('#pw').value=''; await start();
  }catch(ex){ err.textContent=traducir(ex.message); err.hidden=false; }
  $('#lbtn').disabled=false;
});
$('#forgot').addEventListener('click', async ()=>{
  const email=$('#em').value.trim(), err=$('#err'),okm=$('#okm'); err.hidden=true; okm.hidden=true;
  if(!email) return (err.textContent='Escribe tu correo arriba y vuelve a tocar «Olvidaste tu contraseña».', err.hidden=false);
  try{ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]}); if(error)throw error;
    okm.textContent='Te enviamos un correo para crear una nueva contraseña. Revisa tu bandeja (y spam).'; okm.hidden=false;
  }catch(ex){ err.textContent=traducir(ex.message); err.hidden=false; }
});
function traducir(m){ m=(m||'').toLowerCase();
  if(m.includes('invalid login')) return 'Correo o contraseña incorrectos.';
  if(m.includes('email not confirmed')) return 'Confirma tu correo antes de entrar (revisa tu bandeja).';
  if(m.includes('rate')||m.includes('too many')) return 'Demasiados intentos. Espera un momento.';
  return m.charAt(0).toUpperCase()+m.slice(1); }

async function logout(){ me=null; await AUTH.salir(); show('login'); }

// Recuperación: si el usuario llega desde el correo, Supabase emite PASSWORD_RECOVERY.
sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){ recovery=true; } });
/* Sesión del gestor siempre activa: renueva el acceso antes de que venza, también al volver a la ventana o tras suspender la PC. */
const mantenerSesion=async()=>{ try{ await sb.auth.getSession(); }catch(_){} }; // getSession renueva sola si hace falta (sin carreras)
function sesionPerdida(){ if(!me||sesionPerdida.on) return; sesionPerdida.on=true; show('login'); const e=$('#err'); if(e){ e.textContent='Tu sesión se cerró (quizá entraste desde otra ventana). Vuelve a entrar.'; e.hidden=false; } }
sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==='SIGNED_IN') sesionPerdida.on=false; if(ev==='SIGNED_OUT'||(ev==='TOKEN_REFRESHED'&&!ses)) sesionPerdida(); });
setInterval(mantenerSesion,4*60e3);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ try{ sb.auth.startAutoRefresh&&sb.auth.startAutoRefresh(); }catch(_){} mantenerSesion(); } });
addEventListener('focus',mantenerSesion); addEventListener('online',mantenerSesion);

// ---- Navegación ----
const NAV=[['Gestión',[['resumen','📊','Resumen'],['clientes','🗂️','Clientes'],['negocios','📱','Xyro Apps']]],['Operación',[['soporte','🛟','Modo soporte'],['seguridad','🛡️','Seguridad'],['backups','💾','Copias de seguridad'],['registro','🕑','Mi registro']]],['Cuenta',[['cuenta','🔑','Mi cuenta']]]];
function side(){
  $('#side').innerHTML=`<div class="brand"><img class="logo xlogo" src="../img/marca/logo-xyrostudio-app.svg" alt="" width="36" height="36"><span>Xyro<b>Studio</b> <small style="color:var(--mu);font-weight:600">Panel</small></span></div><div class="status"><span class="d"></span>sistema operativo</div>`+
    NAV.map(([g,it])=>[g,it.filter(([id])=>puede(id))]).filter(([,it])=>it.length).map(([g,it])=>`<div class="grp">${g}</div>`+it.map(([id,ic,n])=>`<button class="nv ${id===view?'on':''}" data-v="${id}">${ic} ${n}</button>`).join('')).join('')+
    `<div class="me"><b>${esc(me.nombre)}</b><small>${esc(ROL_NOMBRE[me.rol]||me.rol)} · ${esc(me.email)}</small><button class="btn btn-g btn-sm" data-logout style="width:100%">Cerrar sesión</button></div>`;
}
async function go(v){ if(recovery)v='cuenta'; if(!puede(v))v=NAV.flatMap(([,it])=>it).map(([id])=>id).find(id=>puede(id))||'cuenta'; if(v!==view)editing=null; view=v; side(); $('#side').classList.remove('open'); $('#acts').innerHTML=''; $('#view').innerHTML=await V[v](); scrollTo(0,0); }
async function start(){ show('app'); try{await cargar();}catch(ex){toast('No pude cargar los clientes: '+ex.message);} go(recovery?'cuenta':'resumen'); }

const H=(t,s)=>{$('#h').innerHTML=`<div><h1>${esc(t)}</h1>${s?`<p class="sub" style="margin:4px 0 0">${esc(s)}</p>`:''}</div>`;};

// ---- Vistas ----
const V={};
const estados=[['activo','Activo'],['soporte','En soporte'],['pausado','Pausado'],['baja','Baja']];
const estLabel=e=>(estados.find(x=>x[0]===e)||['','—'])[1];
V.resumen=async ()=>{
  H('Hola, '+me.nombre.split(' ')[0],'Tu agencia de un vistazo.'); $('#acts').innerHTML=`<span class="livechip"><span class="d"></span>${new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})}</span> <button class="btn btn-p" data-v="clientes">Ver clientes</button>`;
  const C=clientes, act=C.filter(c=>c.estado==='activo'||c.estado==='soporte');
  const facturado=C.reduce((a,c)=>a+(+c.costo||0),0);
  const mensual=C.filter(c=>c.estado!=='baja').reduce((a,c)=>a+mensualDe(c),0);
  const pend=C.filter(c=>c.pago==='pendiente').reduce((a,c)=>a+(+c.costo||0),0);
  let segN=0,segF=0;try{const d24=new Date(Date.now()-864e5).toISOString();const[a,f]=await Promise.all([sb.from('xa_seguridad').select('id',{count:'exact',head:true}).in('tipo',['ataque','sospechoso']).gte('creado',d24),sb.from('xa_seguridad').select('id',{count:'exact',head:true}).eq('tipo','login_fallido').gte('creado',d24)]);segN=a.count||0;segF=f.count||0}catch(_){}
  return `${segN||segF>=25?`<div class="note" style="border-color:#ff5c7a66;background:#ff5c7a14">🛡️ <div><b>${segN?`${segN} alerta${segN===1?'':'s'} de seguridad`:`${segF} intentos fallidos de entrar`} en las últimas 24 h.</b> Ya se bloquearon solos. <button class="btn btn-g btn-sm" data-v="seguridad">Ver Seguridad</button></div></div>`:''}<div class="grid4">
      <div class="kpi"><b>${C.length}</b><small>Clientes</small></div>
      <div class="kpi g"><b>${act.length}</b><small>Activos / soporte</small></div>
      <div class="kpi"><b>${soles(facturado)}</b><small>Total facturado</small></div>
      <div class="kpi w"><b>${soles(mensual)}</b><small>Ingreso mensual</small></div></div>
    ${pend?`<div class="note">⚠️ Tienes ${soles(pend)} en pagos pendientes de cobro.</div>`:''}
    <div class="panel"><h3>Clientes recientes</h3><p class="d">Toca uno para ver todo su detalle.</p>
      <div class="clients">${C.slice(0,4).map(clCard).join('')||'<div class="empty">Aún no tienes clientes. Agrega el primero en «Clientes».</div>'}</div></div>`;
};
function clCard(cl){return`<div class="cl"><div class="in"><h4>${esc(cl.negocio)} <span class="tag ${cl.estado}">${estLabel(cl.estado)}</span> <span class="tag ${cl.pago==='pagado'?'pg':'pend'}">${cl.pago==='pagado'?'Pagado':'Por cobrar'}</span></h4>
  <div class="meta"><span>${esc(cl.rubro||'—')}</span><span>${soles(cl.costo)}</span>${+cl.soporte?`<span>+ ${soles(cl.soporte)}/mes</span>`:''}${cl.entregado?`<span>Entregado ${cl.entregado}</span>`:''}</div></div>

async function leerSitio(slug){
  if(!slug)return null;
  const {data:s,error:e1}=await sb.from('sitios').select('id').eq('slug',slug).maybeSingle(); if(e1)throw e1;
  if(!s)return null;
  const {data:c}=await sb.from('contenido').select('valor').eq('sitio_id',s.id).eq('clave','config').maybeSingle();
  let metricas=[], metErr=false;
  try{ const {data:mm,error:em}=await sb.from('metricas').select('dia,tipo,n').eq('sitio_id',s.id); if(em)throw em; metricas=mm||[]; }catch(_){ metErr=true; }
  return { config:(c&&c.valor)||{}, metricas, metErr };
}
function serieDias(rows,tipo,dias){
  const map={}; for(const r of (rows||[])) if(r.tipo===tipo) map[r.dia]=(map[r.dia]||0)+r.n;
  const out=[], hoy=new Date();
  for(let i=dias-1;i>=0;i--){ const d=new Date(hoy); d.setDate(d.getDate()-i); const k=d.toISOString().slice(0,10); out.push({dia:k,n:map[k]||0,etq:d.toLocaleDateString('es-PE',{day:'numeric',month:'short'})}); }
  return out;
}
function barChart(serie,color){
  const max=Math.max(1,...serie.map(s=>s.n));
  const bars=serie.map(s=>{ const h=Math.round(s.n/max*100); return `<div title="${s.etq}: ${s.n}" style="flex:1;min-width:0;display:flex;align-items:flex-end;height:100%"><div style="width:100%;height:${s.n>0?Math.max(h,7):2}%;background:${s.n>0?color:'#1c1c22'};border-radius:4px 4px 2px 2px"></div></div>`; }).join('');
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:92px;margin-top:12px">${bars}</div>`;
}
function statBlock(emo,titulo,serie,color){

const BK_SEC={config:['🎨','Inicio, textos, tema y ajustes'],sedes:['📍','Sedes (WhatsApp, horarios, cafetín)'],planes:['💳','Planes y precios'],pase:['🎟️','Pase diario'],notaPlanes:['📝','Nota de planes'],entrenadores:['🏋️','Coaches'],clases:['🗓️','Horario de clases'],nutricion:['🥗','Asesoría nutricional'],cafetin:['🥤','Cafetín (productos y combos)'],publicaciones:['📣','Promos y eventos'],galeria:['🎬','Galería']};
const bkLabel=x=>x&&typeof x==='object'?(x.titulo||x.nombre||x.negocio||x.id||'(sin nombre)'):String(x);
const bkVal=v=>{ if(v===null||v===undefined||v==='') return '∅ vacío'; if(typeof v==='boolean') return v?'Sí':'No';
  if(typeof v==='object') return Array.isArray(v)?`[${v.length} elementos]`:'{…}';
  const t=String(v); if(/^(https?:|idb:|img\/|vid\/)/.test(t)&&/\.(jpe?g|png|webp|gif|mp4|webm)|idb:/i.test(t)) return '🖼️ '+t.split('/').pop().slice(0,40); return t.length>90?t.slice(0,90)+'…':t; };
function bkFlat(o,p='',out={}){ if(o&&typeof o==='object'&&!Array.isArray(o)){ for(const k of Object.keys(o)) bkFlat(o[k],p?p+'.'+k:k,out); }
  else if(Array.isArray(o)&&o.some(x=>x&&typeof x==='object')){ o.forEach((x,i)=>bkFlat(x,(p?p+'.':'')+(x&&x.id?x.id:i),out)); }
  else out[p]=Array.isArray(o)?o.join(' | '):o; return out; }
function bkDiff(actual,copia){
  const L=[];
  const esLista=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&x.id);
  if(esLista(actual)||esLista(copia)){
    const A=new Map((actual||[]).map(x=>[x.id,x])), C=new Map((copia||[]).map(x=>[x.id,x]));
    for(const [id,x] of C){ if(!A.has(id)) L.push(['add',`Volvería: «${bkLabel(x)}»`]); }
    for(const [id,x] of A){ if(!C.has(id)) L.push(['del',`Se quitaría: «${bkLabel(x)}» (existe hoy, no estaba en la copia)`]); }
    for(const [id,x] of C){ const y=A.get(id); if(!y||JSON.stringify(x)===JSON.stringify(y)) continue;
      const fa=bkFlat(y), fc=bkFlat(x), ks=[...new Set([...Object.keys(fa),...Object.keys(fc)])].filter(k=>JSON.stringify(fa[k])!==JSON.stringify(fc[k]));
      L.push(['mod',`Cambia «${bkLabel(x)}»`,ks.slice(0,12).map(k=>[k,fa[k],fc[k]])]); }
    if(!L.length&&JSON.stringify((actual||[]).map(x=>x.id))!==JSON.stringify((copia||[]).map(x=>x.id))) L.push(['mod','Cambia el orden de los elementos',[]]);
    return L;

  return L;
}

    if('prunebackups'in d){ if(!confirm('¿Borrar todas las copias de más de 30 días?'))return; try{ const cut=new Date(Date.now()-30*864e5).toISOString(); const {error}=await sb.from('backups').delete().lt('creado',cut); if(error)throw error; touch('Borró copias viejas'); toast('Copias viejas borradas'); }catch(ex){ toast(ex.message); } return go('backups'); }
    if('clearlog'in d){ if(!confirm('¿Borrar tu registro privado de este dispositivo?'))return; localStorage.removeItem(LOG); return go('registro'); }
  }catch(ex){ toast(ex.message||'Error'); }
});

(async()=>{
  show('loading');

    const perfil=await AUTH.actual();

})();
})();
