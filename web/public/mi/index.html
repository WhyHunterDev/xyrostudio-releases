<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Xyro</title>
<meta name="description" content="Tu gimnasio, tu consultorio y más en tu celular: tu QR de entrada, tu plan, tus rutinas y tus citas.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="manifest" href="/mi/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--a:#7c5cff;--bg:#000;--c1:#0d0d0f;--c2:#151518;--ln:#ffffff14;--tx:#f2f2f5;--mu:#9a9aa6;--ok:#22c55e;--wa:#f59e0b;--ko:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 110px;-webkit-overflow-scrolling:touch}
.in{animation:in .45s cubic-bezier(.2,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.15}
h2{font-size:19px;letter-spacing:-.02em}
h3{font-size:15px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:16px;display:grid;gap:10px}
.g{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;background:var(--c2);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--a);color:#fff}.btn.l{background:none;color:var(--mu);font-weight:600;padding:8px}
.btn[disabled]{opacity:.5}
label{display:grid;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
input{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:14px;font-size:16px;outline:none;width:100%}
input:focus{border-color:var(--a)}
.msg{font-size:13px;padding:10px 12px;border-radius:12px;background:#ef444422;color:#fca5a5;display:none}.msg.on{display:block}
.msg.ok{background:#22c55e22;color:#86efac}
/* Pantalla de entrada */
.hero{min-height:100%;display:grid;align-content:center;gap:20px;max-width:400px;margin:0 auto;position:relative}
.hero .top{display:grid;justify-items:center;text-align:center;gap:10px;margin-bottom:6px}
.hero .top h1{font-size:30px;font-weight:900;letter-spacing:-.04em}
.eyb{font-size:11px;font-weight:800;letter-spacing:.28em;color:var(--a)}
.aur{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.aur i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.22;background:var(--a);top:-260px;left:50%;margin-left:-260px;animation:fl 9s ease-in-out infinite alternate}
.aur i+i{width:360px;height:360px;background:#3ad6ff;opacity:.10;top:auto;bottom:-220px;left:10%;margin:0;animation-duration:12s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.1)}}
.scr>*{position:relative;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:#ffffff0d;border:1px solid var(--ln);color:#d6d6de}
.chip svg{width:14px;height:14px;color:var(--a)}
.ibox{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);flex:none}
.ibox.big{width:84px;height:84px;border-radius:26px;position:relative;overflow:hidden}
.ibox.big::after{content:"";position:absolute;left:14%;right:14%;height:2px;background:var(--a);box-shadow:0 0 14px var(--a);top:18%;animation:scan 1.8s ease-in-out infinite alternate}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr .av{width:44px;height:44px;border-radius:14px;font-size:18px;cursor:pointer}
.lg{width:64px;height:64px;border-radius:18px;object-fit:contain;background:var(--c2);padding:6px}
.orb{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;background:#0b0b0e;border:1px solid var(--ln);position:relative;box-shadow:0 20px 60px -20px var(--a)}
.orb::after{content:"";position:absolute;inset:-1px;border-radius:28px;border:2px solid var(--a);opacity:.55;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.08);opacity:0}}
/* Carnet */
.carnet{position:relative;border-radius:26px;padding:20px;background:var(--c1);border:1px solid var(--ln);overflow:hidden;display:grid;gap:14px;justify-items:center;text-align:center}
.carnet::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--a)}
.carnet::after{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 45%,#ffffff12 50%,transparent 55%);animation:sh 4s infinite;pointer-events:none}
@keyframes sh{from{transform:translateX(-50%)}to{transform:translateX(50%)}}
.qr{overflow:hidden;background:#fff;padding:12px;border-radius:18px;width:min(230px,62vw);cursor:pointer}
.qr svg{display:block;width:100%;height:auto}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12px;background:var(--c2)}
.pill.ok{color:var(--ok)}.pill.wa{color:var(--wa)}.pill.ko{color:var(--ko)}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}
.ring .bk{stroke:var(--c2)}.ring .fg{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,1,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;line-height:1;text-align:center}
.ring b small{display:block;font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st>div{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px}
.st b{font-size:22px;display:block}
/* Negocios */
.negs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.negs::-webkit-scrollbar{display:none}
.neg{flex:none;display:flex;gap:8px;align-items:center;padding:7px 12px 7px 7px;border-radius:999px;background:var(--c1);border:1px solid var(--ln);font-weight:700;font-size:13px;cursor:pointer}
.neg.on{border-color:var(--a);background:var(--c2)}
.neg i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--c2);overflow:hidden}
.neg i img{width:100%;height:100%;object-fit:cover}
/* Rutina */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:14px;padding:10px 0;background:var(--c1);font-weight:800;font-size:13px;cursor:pointer;position:relative}
.day.on{background:var(--a);color:#fff}.day.hoy::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.day.vac{opacity:.35}.day.on.vac{opacity:1}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--c2);font-size:12px;font-weight:800;color:var(--a)}
.li.hecho .dot{background:var(--a);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width 1s}
.vacio{text-align:center;padding:34px 16px;display:grid;gap:8px;justify-items:center}
.vacio .e{font-size:42px}
/* Barra inferior */
.tabs{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;background:#0d0d0fe8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:24px;padding:6px;max-width:480px;margin:0 auto}
.tab{flex:1;border:0;background:none;border-radius:18px;padding:8px 0 6px;display:grid;gap:2px;justify-items:center;font-size:11px;font-weight:700;color:var(--mu);cursor:pointer}
.tab svg{width:23px;height:23px;opacity:.55;transition:.2s}.tab{position:relative}.tab b.dt{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #0d0d0f}
.tab.on{color:var(--tx)}.tab.on svg{opacity:1;color:var(--a)}
.wrap{max-width:480px;margin:0 auto}
/* Hoja */
.ov{position:fixed;inset:0;background:#000c;display:grid;align-items:end;z-index:9;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{background:var(--c1);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-width:520px;width:100%;margin:0 auto;animation:up .3s cubic-bezier(.2,1,.3,1);max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.qrfull{position:fixed;inset:0;background:#fff;z-index:10;display:grid;place-items:center;gap:16px;align-content:center;color:#000;text-align:center;padding:20px}
.qrfull svg{width:min(80vw,420px);height:auto}
.demo{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:18px;z-index:5;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--wa);color:#000}
.pronto{border-style:dashed}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--c2);border:1px solid var(--ln);padding:10px 16px;border-radius:14px;font-size:14px;z-index:11;animation:in .3s}
.cover{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -16px 0;height:230px;background:var(--c1) center/cover no-repeat}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,transparent 35%,transparent 55%,#000 100%)}
.nhead{position:relative;z-index:1;margin-top:-52px;display:grid;gap:6px;justify-items:center;text-align:center}
.back.fl{position:absolute;z-index:3;top:0;left:0;width:40px;height:40px;padding:0;justify-content:center;border-radius:14px;background:#0008;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:22px;border:1px solid #ffffff22}
.nwrap{position:relative}
.nhead .lg{width:92px;height:92px;border-radius:26px;border:4px solid #000;background:var(--c2);box-shadow:0 10px 30px -10px var(--a)}
.promo{border-radius:22px;padding:16px;background:var(--c1);border:1px solid var(--a);position:relative;overflow:hidden;display:grid;gap:6px}
.promo::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--a);opacity:.18}
.promo img{width:calc(100% + 32px);margin:-16px -16px 6px;max-height:200px;object-fit:cover}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x mandatory}.hs::-webkit-scrollbar{display:none}
.hs>*{flex:none;width:78%;scroll-snap-align:start}
.plan{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:16px;display:grid;gap:4px}
.plan.dest{border-color:var(--a)}.plan b.pr{font-size:26px;letter-spacing:-.02em}
.idbox{border-radius:24px;padding:20px;background:var(--c1);border:1px solid var(--a);text-align:center;display:grid;gap:8px}
.idbox b{font-size:34px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.av{width:64px;height:64px;border-radius:22px;background:var(--a);display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.aviso{margin-bottom:14px;border:1px solid var(--a);background:var(--c1);border-radius:22px;padding:16px;display:grid;gap:10px;animation:in .5s}
.back{display:inline-flex;gap:6px;align-items:center;border:0;background:none;color:var(--mu);font-weight:700;padding:4px 0 12px;cursor:pointer}
.tab.scan{flex:0 0 76px}.tab.scan .fab{width:58px;height:58px;margin-top:-30px;border-radius:20px;background:var(--a);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px var(--a),0 0 0 6px #000}.tab.scan .fab svg{opacity:1;width:26px;height:26px}
.btn svg{width:20px;height:20px}
.cam{position:fixed;inset:0;background:#000;z-index:12;display:grid}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .mk{position:absolute;left:50%;top:45%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28px;box-shadow:0 0 0 100vmax #000a;border:3px solid var(--a)}
.cam .mk::after{content:"";position:absolute;left:8%;right:8%;height:3px;background:var(--a);top:10%;animation:scan 2s ease-in-out infinite alternate;box-shadow:0 0 18px var(--a)}
@keyframes scan{to{top:88%}}
.cam .bt{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:grid;gap:10px;text-align:center}
.gbtn{background:#fff;color:#111}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--c1);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:10px;font-weight:800;color:var(--mu);cursor:pointer}.seg button.on{background:var(--c2);color:var(--tx)}
</style>
</head>
<body>
<div id="app"><div class="scr"><div class="hero" style="justify-items:center"><div class="orb"><img src="/img/marca/logo-xyrostudio-app.svg" width="48" height="48" alt=""></div></div></div></div>
<script>
/* Mi Xyro · app de las personas en el ecosistema Xyro (SQL 45 + 46).
   Cuenta con Google o correo; perfil con @usuario e ID fijo; guarda negocios escaneando su QR (/mi/?n=slug);
   el negocio la conecta a su ficha con el ID y la persona acepta (aviso). Fases futuras: mapa, puntos, sorteos. */
'use strict';
const SB={url:'https://szvdzcaoxjstdyblhxrd.supabase.co',key:'sb_publishable_LOmoV7GDpORg5J1eE7YriA_tB4Y6EYe'};
const P=new URLSearchParams(location.search),HOME=location.origin+'/mi/';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k){try{return localStorage.getItem(k)}catch(_){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}};
const cel=t=>String(t||'').replace(/\D/g,'').slice(-9);
const hoyL=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10);
const dLima=t=>new Date(new Date(t).getTime()-5*36e5).toISOString().slice(0,10);
const fF=(d,o)=>new Date(String(d).length===10?d+'T12:00:00-05:00':d).toLocaleDateString('es-PE',{timeZone:'America/Lima',...(o||{day:'numeric',month:'short',year:'numeric'})});
const fH=d=>new Date(d).toLocaleTimeString('es-PE',{timeZone:'America/Lima',hour:'numeric',minute:'2-digit'});
const dias=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const money=n=>'S/ '+(Math.round(+n*100)/100).toLocaleString('es-PE',{minimumFractionDigits:0,maximumFractionDigits:2});
const js=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)};
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}};
const DIAS=[['d1','L','Lunes'],['d2','M','Martes'],['d3','M','Miércoles'],['d4','J','Jueves'],['d5','V','Viernes'],['d6','S','Sábado'],['d7','D','Domingo']];
const COMIDAS=[['desayuno','🌅','Desayuno'],['media','🍎','Media mañana'],['almuerzo','🍽️','Almuerzo'],['merienda','🥤','Media tarde'],['cena','🌙','Cena']];
const lineas=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const idTxt=n=>String(n||'').replace(/(\d{4})(\d{4})/,'$1 $2');
const DEMO=P.get('demo');
const SV=d=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={home:SV('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
 store:SV('<path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5V20h16V9.5M9.5 20v-5h5v5"/>'),
 scan:SV('<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M4 12h16"/>'),
 user:SV('<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>'),
 qr:SV('<rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h2.5v2.5H14zM20.5 14v.01M14 20.5h.01M17.5 20.5h3v-3"/>'),
 id:SV('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M5.8 16.2c.6-1.4 1.8-2 3.2-2s2.6.6 3.2 2M15 10h3.5M15 13.5h3.5"/>'),
 gift:SV('<rect x="3.5" y="8" width="17" height="4.5" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8v12M12 8S10.5 3.5 8 4.6 9.2 8 12 8zM12 8s1.5-4.5 4-3.4S14.8 8 12 8z"/>'),
 map:SV('<path d="M9 4.5 3.5 6.5v13l5.5-2 6 2 5.5-2v-13l-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/>'),
 trophy:SV('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1A3.5 3.5 0 0 0 8 10.5M16 6h3.5v1a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/>'),
 cal:SV('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>'),
 dumb:SV('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>')};
let sb=null,D=null,TAB='inicio',SUB=null,CUR=+(ls.g('mi-neg')||0),INSTALL=null,post=null,NEG={};

// ---------- Conexión ----------
async function cliente(){
 if(sb)return sb;
 await js('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
 sb=supabase.createClient(SB.url,SB.key,{auth:{storageKey:'xyro-mi-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(nuevaClave,300)});
 return sb;
}
async function rpc(f,a){if(DEMO)return demoRpc(f,a);const{data,error}=await sb.rpc(f,a||{});if(error)throw error;if(data&&data.error)throw data.error;return data}
async function cargar(){
 if(DEMO){D=D||demoData();return D}
 D=await rpc('xa_yo');ls.s('mi-data',JSON.stringify(D));return D;
}
const negs=()=>(D&&D.negocios)||[];
const N=()=>negs()[Math.min(CUR,negs().length-1)]||null;
const dental=n=>(n||N()||{}).rubro==='consultorio';
const ACC='#7c5cff';
function acento(n){const c=n&&n.color&&/^#[0-9a-f]{6}$/i.test(n.color)?n.color:ACC;document.documentElement.style.setProperty('--a',c)}

let camStream=null;
async function escanear(){
 const o=document.createElement('div');o.className='cam';o.innerHTML=`<video playsinline muted autoplay></video><div class="mk"></div><div class="bt"><b style="text-shadow:0 2px 10px #000">Apunta al QR del negocio</b><p class="msg" id="cmm"></p><button class="btn" id="cx">Cerrar</button></div>`;
 document.body.appendChild(o);const v=o.querySelector('video'),m=o.querySelector('#cmm');let vivo=true;
 const fin=()=>{vivo=false;try{camStream&&camStream.getTracks().forEach(t=>t.stop())}catch(_){}camStream=null;o.remove()};
 o.querySelector('#cx').onclick=fin;
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=camStream;await v.play()}
 catch(_){m.textContent='No pudimos abrir tu cámara. Dale permiso o abre la cámara de tu celular y escanea el QR.';m.className='msg on';return}
 let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(_){}}
 if(!det){try{if(!window.jsQR)await js('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js')}catch(_){}}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const leer=async()=>{if(!vivo)return;let t='';
  try{if(det){const r=await det.detect(v);t=r[0]&&r[0].rawValue||''}
   else if(window.jsQR&&v.videoWidth){const w=480,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h);t=r&&r.data||''}}catch(_){}
  if(t){const s=slugDe(t),c=/[?&]c=/.test(t)?codigoDe(t):'';
   if(s){vib();fin();await abrirNeg(s);if(D&&NEG[s]&&!NEG[s].guardado&&!NEG[s].socio)guardarNeg(s,true);return}
   if(c){vib();fin();return conCodigo(c)}
   m.textContent='Ese QR no es de un negocio Xyro.';m.className='msg on'}
  setTimeout(leer,250)};
 leer();
}
