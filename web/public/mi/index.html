<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Xyro</title>
<meta name="description" content="Tu gimnasio, tu consultorio y más en tu celular: tu QR de entrada, tu plan, tus rutinas y tus citas.">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi Xyro">
<link rel="manifest" href="/mi/manifest.webmanifest">
<link rel="icon" href="/img/marca/logo-xyrostudio-app.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="/img/logo.png">
<style>*{scrollbar-width:thin;scrollbar-color:rgba(140,140,150,.35) transparent}::-webkit-scrollbar{width:8px;height:8px;background:transparent}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-thumb{background:rgba(140,140,150,.35);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:rgba(160,160,170,.6)}::-webkit-scrollbar-button{display:none;height:0;width:0}

:root{--a:#7c5cff;--a2:#3ad6ff;--gr:linear-gradient(135deg,#7c5cff,#5b7cff 55%,#3ab8ff);--bg:#05060a;--c1:#0f1220d9;--c2:#1a1e2e;--ln:#ffffff17;--tx:#f2f2f5;--mu:#9a9aa6;--ok:#22c55e;--wa:#f59e0b;--ko:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
/* Fondo Xyro (igual que el panel): red de partículas moradas, aura y brillo al tocar. Color fijo, no editable. */
#fx{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.fxa{position:fixed;width:80vmax;height:80vmax;left:50%;top:0;transform:translate(-50%,-55%);border-radius:50%;background:radial-gradient(closest-side,#7c5cff40,transparent);filter:blur(20px);z-index:0;pointer-events:none}
.fxg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx,50%) var(--my,30%),#7c5cff26,transparent 60%)}
.card,.carnet,.st>div,.plan,.neg,.idbox,.aviso,.promo{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scr{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 110px;-webkit-overflow-scrolling:touch}
.in{animation:in .45s cubic-bezier(.2,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.15}
h2{font-size:19px;letter-spacing:-.02em}
h3{font-size:15px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:16px;display:grid;gap:10px}
.g{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;background:var(--c2);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--gr);color:#fff;box-shadow:0 10px 26px -12px #7c5cff}.btn.l{background:none;color:var(--mu);font-weight:600;padding:8px}
.btn[disabled]{opacity:.5}
label{display:grid;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
input{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:14px;font-size:16px;outline:none;width:100%}
input:focus{border-color:var(--a)}
.msg{font-size:13px;padding:10px 12px;border-radius:12px;background:#ef444422;color:#fca5a5;display:none}.msg.on{display:block}
.msg.ok{background:#22c55e22;color:#86efac}
/* Pantalla de entrada */
.hero{min-height:100%;display:grid;align-content:center;gap:20px;max-width:400px;margin:0 auto;position:relative}
.hero .top{display:grid;justify-items:center;text-align:center;gap:10px;margin-bottom:6px}
.hero .top h1{font-size:30px;font-weight:900;letter-spacing:-.04em}
.eyb{font-size:11px;font-weight:800;letter-spacing:.28em;color:var(--a)}
.aur{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.aur i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.22;background:var(--a);top:-260px;left:50%;margin-left:-260px;animation:fl 9s ease-in-out infinite alternate}
.aur i+i{width:360px;height:360px;background:#3ad6ff;opacity:.10;top:auto;bottom:-220px;left:10%;margin:0;animation-duration:12s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.1)}}
.scr>*{position:relative;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:#ffffff0d;border:1px solid var(--ln);color:#d6d6de}
.chip svg{width:14px;height:14px;color:var(--a)}
.ibox{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);flex:none}
.ibox.big{width:84px;height:84px;border-radius:26px;position:relative;overflow:hidden}
.ibox.big::after{content:"";position:absolute;left:14%;right:14%;height:2px;background:var(--a);box-shadow:0 0 14px var(--a);top:18%;animation:scan 1.8s ease-in-out infinite alternate}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr .av{width:44px;height:44px;border-radius:14px;font-size:18px;cursor:pointer}
.lg{width:64px;height:64px;border-radius:18px;object-fit:contain;background:var(--c2);padding:6px}
.orb{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;background:#0b0b0e;border:1px solid var(--ln);position:relative;box-shadow:0 20px 60px -20px var(--a)}
.orb::after{content:"";position:absolute;inset:-1px;border-radius:28px;border:2px solid var(--a);opacity:.55;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.08);opacity:0}}
/* Carnet */
.carnet{position:relative;border-radius:26px;padding:20px;background:var(--c1);border:1px solid var(--ln);overflow:hidden;display:grid;gap:14px;justify-items:center;text-align:center}
.carnet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gr)}
/* Xyro Card: tarjeta de cuenta por nivel (normal morado, Xyro+ titanio, fundador oro) */
.xcard{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:22px;padding:18px 20px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;cursor:pointer;color:#fff;
 background:linear-gradient(135deg,#6a4cff,#4b5cff 45%,#2a8dff);box-shadow:0 24px 50px -24px #7c5cffaa,inset 0 1px 0 #ffffff40;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease;margin-bottom:14px;user-select:none;-webkit-user-select:none}
.xcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff08 0 2px,transparent 2px 6px),radial-gradient(120% 90% at 90% -10%,#ffffff40,transparent 55%);pointer-events:none}
.xcard::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,#ffffff40 50%,transparent 58%);transform:translateX(-60%);animation:xsh 5s ease-in-out infinite;pointer-events:none}
@keyframes xsh{55%,100%{transform:translateX(60%)}}
.xcard .xt{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.xcard .xl{font-weight:900;letter-spacing:.32em;font-size:13px;opacity:.95}.xcard .xl small{display:block;letter-spacing:.2em;font-size:9.5px;opacity:.75;margin-top:3px;font-weight:800}
.xcard .xm{width:34px;height:34px;border-radius:10px;background:#ffffff26;display:grid;place-items:center;backdrop-filter:blur(4px)}
.xcard .xchip{position:relative;z-index:1;align-self:center;width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f3f0e6,#bdb6a3 50%,#efe9d6);box-shadow:inset 0 0 0 1px #0002}
.xcard .xchip::before{content:"";position:absolute;inset:7px 0;border-top:1px solid #0003;border-bottom:1px solid #0003}.xcard .xchip::after{content:"";position:absolute;inset:0 15px;border-left:1px solid #0003;border-right:1px solid #0003}
.xcard .xn{font-size:34px;font-weight:900;letter-spacing:.04em;position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0002}
.xcard .xb{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative;z-index:1;min-width:0}
.xcard .xb b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xcard .xb span{font-size:12px;opacity:.8}
.xcard .xid{text-align:right;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;opacity:.85;white-space:nowrap}
.xcard.f{color:#2a1c05;background:linear-gradient(125deg,#8a6114,#e6b84d 22%,#fff1bf 38%,#d9a43c 52%,#9a6c18 70%,#f2d27a 88%,#a87a20);box-shadow:0 26px 56px -24px #e6b84daa,inset 0 1px 0 #fff8,inset 0 -1px 0 #0003}
.xcard.f::after{background:linear-gradient(115deg,transparent 40%,#fffbe8cc 50%,transparent 60%)}
.xcard.f .xm{background:#2a1c0518}.xcard.f .xn{background:linear-gradient(180deg,#3a2706,#6b4a0c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.xcard.p{background:linear-gradient(135deg,#0c0d12,#2a2d36 40%,#11131a 70%,#3a3e4a);box-shadow:0 24px 50px -24px #000,inset 0 1px 0 #ffffff30;color:#e9ecf3}
.xcard.p .xl{background:linear-gradient(90deg,#fff,#a9b0c2,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.xcard.o{background:linear-gradient(135deg,#050507,#16121f 35%,#0a0a10 60%,#1d1730);color:#f3f0ff;box-shadow:0 26px 56px -24px #7c5cffaa,inset 0 1px 0 #ffffff26}
.xcard.o::before{background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 6px),radial-gradient(90% 80% at 85% 0%,#7c5cff55,transparent 60%),radial-gradient(70% 60% at 0% 110%,#3ad6ff33,transparent 60%)}
.xcard.o .xn{background:conic-gradient(from 200deg,#ff9de2,#9de7ff,#b9ffb0,#fff59d,#c9a7ff,#ff9de2);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;font-size:44px}
.xcard.o .xl{background:linear-gradient(90deg,#fff,#c9b8ff,#9de7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.xcard.s{background:linear-gradient(135deg,#0b1220,#1b2a44 45%,#0e1626 70%,#24395e);color:#e6eefc;box-shadow:0 24px 50px -24px #3a8bffaa,inset 0 1px 0 #ffffff26}
.xcard.s .xn{color:#9ec3ff;letter-spacing:.2em}
.xholo{position:absolute;right:18px;bottom:44px;width:38px;height:24px;border-radius:6px;background:conic-gradient(from 0deg,#ff9de2,#9de7ff,#b9ffb0,#fff59d,#ff9de2);opacity:.55;mix-blend-mode:overlay;z-index:1}
@media (prefers-reduced-motion:reduce){.xcard::after{animation:none;display:none}.xcard{transform:none!important}}
.tsec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}.tsec h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini>div{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:12px;display:grid;gap:2px;min-width:0;backdrop-filter:blur(6px)}
.mini b{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}.mini small{font-size:11px;color:var(--mu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.fund .mini>div{border-color:#e6b84d33}body.fund .ibox{background:#e6b84d1c;color:#e6b84d}body.fund .mini b{color:#f3d68a}
.perks{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}.perks::-webkit-scrollbar{display:none}
.perk{flex:none;width:150px;border-radius:18px;padding:14px;background:var(--c1);border:1px solid var(--ln);display:grid;gap:6px;backdrop-filter:blur(6px)}
.perk i{font-style:normal;font-size:22px}.perk b{font-size:14px}.perk span{font-size:12px;color:var(--mu)}
body.fund .perk{background:linear-gradient(160deg,#2b2110cc,#0f1220d9);border-color:#e6b84d40}
.xplus{border-radius:22px;padding:18px;background:linear-gradient(135deg,#0c0d12,#22252e 60%,#0c0d12);border:1px solid #ffffff22;display:grid;gap:10px;position:relative;overflow:hidden}
.xplus h3{font-size:18px}.xplus .tag{justify-self:start;font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:999px;background:#ffffff14;color:#cfd5e2}
.fbad{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#1a1204;background:linear-gradient(135deg,#fbe7a1,#e6b84d 45%,#b8862b);box-shadow:0 0 18px #e6b84d55;white-space:nowrap}
body.fund .carnet{border-color:#e6b84d66;background:linear-gradient(160deg,#2b2110e6,#14110bd9 60%,#0f1220d9)}
body.fund .carnet::before{background:linear-gradient(90deg,#b8862b,#fbe7a1,#e6b84d,#b8862b);height:4px}
body.fund .carnet::after{background:linear-gradient(115deg,transparent 45%,#fbe7a126 50%,transparent 55%)}
body.fund .idbox{border-color:#e6b84d66}body.fund .idbox b{background:linear-gradient(90deg,#fbe7a1,#e6b84d,#fbe7a1);-webkit-background-clip:text;background-clip:text;color:transparent}
body.fund .btn.p{background:linear-gradient(135deg,#fbe7a1,#e6b84d 45%,#b8862b);color:#1a1204;box-shadow:0 10px 26px -12px #e6b84d}
body.fund .tab.scan .fab{background:linear-gradient(135deg,#fbe7a1,#e6b84d 45%,#b8862b);color:#1a1204;box-shadow:0 12px 30px -8px #e6b84d,0 0 0 6px var(--bg)}
body.fund .tab.on svg{color:#e6b84d}body.fund .tabs{border-color:#e6b84d33}
body.fund .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #e6b84d,0 0 22px #e6b84d66}
body.fund .hdr h1{background:linear-gradient(90deg,#fff 30%,#fbe7a1 60%,#e6b84d);-webkit-background-clip:text;background-clip:text;color:transparent}
body.fund .fxa{background:radial-gradient(closest-side,#e6b84d30,transparent)}body.fund .fxg{background:radial-gradient(520px circle at var(--mx,50%) var(--my,30%),#e6b84d1f,transparent 60%)}
.fbad{position:relative;overflow:hidden}.fbad::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#fff9 50%,transparent 65%);transform:translateX(-100%);animation:fsh 3.2s ease-in-out infinite}
@keyframes fsh{60%,100%{transform:translateX(100%)}}@media (prefers-reduced-motion:reduce){.fbad::after{animation:none;display:none}}
.fcard{border-color:#e6b84d55!important;background:linear-gradient(160deg,#2b2110cc,#0f1220d9)!important}

.carnet::after{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 45%,#ffffff12 50%,transparent 55%);animation:sh 4s infinite;pointer-events:none}
@keyframes sh{from{transform:translateX(-50%)}to{transform:translateX(50%)}}
.qr{overflow:hidden;background:#fff;padding:14px;border-radius:22px;width:min(236px,64vw);cursor:pointer;box-shadow:0 18px 40px -22px #000}
body.fund .qr{box-shadow:0 0 0 2px #e6b84d,0 18px 40px -18px #e6b84d88}
.qr svg{display:block;width:100%;height:auto}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12px;background:var(--c2)}
.pill.ok{color:var(--ok)}.pill.wa{color:var(--wa)}.pill.ko{color:var(--ko)}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}
.ring .bk{stroke:var(--c2)}.ring .fg{stroke:url(#rgg);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,1,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;font-size:24px;line-height:1;text-align:center}
.ring b small{display:block;font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st>div{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px}
.st b{font-size:22px;display:block}
/* Negocios */
.negs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.negs::-webkit-scrollbar{display:none}
.neg{flex:none;display:flex;gap:8px;align-items:center;padding:7px 12px 7px 7px;border-radius:999px;background:var(--c1);border:1px solid var(--ln);font-weight:700;font-size:13px;cursor:pointer}
.neg.on{border-color:var(--a);background:var(--c2)}
.neg i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--c2);overflow:hidden}
.neg i img{width:100%;height:100%;object-fit:cover}
/* Rutina */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:14px;padding:10px 0;background:var(--c1);font-weight:800;font-size:13px;cursor:pointer;position:relative}
.day.on{background:var(--a);color:#fff}.day.hoy::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.day.vac{opacity:.35}.day.on.vac{opacity:1}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--c2);font-size:12px;font-weight:800;color:var(--a)}
.li.hecho .dot{background:var(--a);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width 1s}
.vacio{text-align:center;padding:34px 16px;display:grid;gap:8px;justify-items:center}
.vacio .e{font-size:42px}
[hidden]{display:none!important}
/* Inicio y solicitudes */
.qk{display:flex;gap:8px;overflow-x:auto;margin:-4px -16px 14px;padding:0 16px;scrollbar-width:none}.qk::-webkit-scrollbar{display:none}
.qkb{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px 10px 10px;border-radius:18px;background:var(--c1);border:1px solid var(--ln);cursor:pointer;text-align:left;backdrop-filter:blur(6px)}
.qkb svg{width:30px;height:30px;padding:6px;border-radius:11px;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.qkb b{display:block;font-size:13px}.qkb small{display:block;font-size:11px;color:var(--mu);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd{width:100%;text-align:left;cursor:pointer;color:inherit}.fd .ibox{width:44px;height:44px;border-radius:14px;font-size:21px}
.fd.nv{border-color:color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 10px 30px -18px var(--a)}.fd.wa{border-color:#f59e0b66}
.sec{font-weight:800;letter-spacing:.06em;margin-top:6px}
.fl2{width:24px;height:24px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--c2);font-size:13px;flex:none}.fl2 img{width:100%;height:100%;object-fit:cover}
.hr{height:1px;background:var(--ln);margin:2px 0}
.btn.s2{padding:11px 14px;font-size:14px;background:color-mix(in srgb,var(--a) 16%,var(--c2));color:#e4ddff}
.pst{display:flex;gap:10px;align-items:center;width:100%;border:1px dashed color-mix(in srgb,var(--a) 55%,transparent);background:color-mix(in srgb,var(--a) 8%,transparent);border-radius:14px;padding:11px 12px;font-size:13px;font-weight:700;text-align:left;cursor:pointer;color:inherit}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--wa);flex:none}.pdot.nv{background:#ef4444;box-shadow:0 0 0 4px #ef444433}
.sel{display:flex;gap:8px;flex-wrap:wrap}

const esFund=()=>!!(D&&D.persona&&D.persona.fundador);
function qrSVG(code,gold){const q=qrcode(0,'H');q.addData(code);q.make();const N=q.getModuleCount(),h=(N*.22|0)|1,h0=(N-h)/2,id='g'+Math.random().toString(36).slice(2,7);
 const C=gold?['#5e3f06','#9c7018','#6b4708']:['#5b3df5','#3a8bff','#4b36d6'],dot=gold?'#17120a':'#0d0e1a';
 const ojo=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7,mid=(x,y)=>x>=h0-1&&x<h0+h+1&&y>=h0-1&&y<h0+h+1;let d='';
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(q.isDark(y,x)&&!ojo(x,y)&&!mid(x,y))d+=`M${x+.3} ${y}h.4a.3 .3 0 0 1 .3 .3v.4a.3 .3 0 0 1-.3 .3h-.4a.3 .3 0 0 1-.3-.3v-.4a.3 .3 0 0 1 .3-.3z`;
 const eye=(x,y)=>`<rect x="${x+.5}" y="${y+.5}" width="6" height="6" rx="1.2" fill="none" stroke="url(#${id})" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".6" fill="url(#${id})"/>`;
 const c=N/2,r=h/2+.35;
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 ${N+2} ${N+2}" role="img" aria-label="Código QR"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C[0]}"/><stop offset=".5" stop-color="${C[1]}"/><stop offset="1" stop-color="${C[2]}"/></linearGradient></defs>
 <path d="${d}" fill="${dot}"/>${eye(0,0)}${eye(N-7,0)}${eye(0,N-7)}
 <rect x="${c-r}" y="${c-r}" width="${2*r}" height="${2*r}" rx="${r*.45}" fill="url(#${id})"/><g stroke="#fff" stroke-width="${r*.36}" stroke-linecap="round"><line x1="${c-r*.42}" y1="${c-r*.42}" x2="${c+r*.42}" y2="${c+r*.42}"/><line x1="${c+r*.42}" y1="${c-r*.42}" x2="${c-r*.42}" y2="${c+r*.42}"/></g></svg>`}
