<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Xyro</title>
<meta name="description" content="Tu gimnasio, tu consultorio y más en tu celular: tu QR de entrada, tu plan, tus rutinas y tus citas.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi Xyro">
<link rel="manifest" href="/mi/manifest.webmanifest">
<link rel="icon" href="/img/marca/logo-xyrostudio-app.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/logo.png">
<style>
:root{--a:#7c5cff;--bg:#000;--c1:#0d0d0f;--c2:#151518;--ln:#ffffff14;--tx:#f2f2f5;--mu:#9a9aa6;--ok:#22c55e;--wa:#f59e0b;--ko:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 110px;-webkit-overflow-scrolling:touch}
.in{animation:in .45s cubic-bezier(.2,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.15}
h2{font-size:19px;letter-spacing:-.02em}
h3{font-size:15px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:16px;display:grid;gap:10px}
.g{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;background:var(--c2);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--a);color:#fff}.btn.l{background:none;color:var(--mu);font-weight:600;padding:8px}
.btn[disabled]{opacity:.5}
label{display:grid;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
input{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:14px;font-size:16px;outline:none;width:100%}
input:focus{border-color:var(--a)}
.msg{font-size:13px;padding:10px 12px;border-radius:12px;background:#ef444422;color:#fca5a5;display:none}.msg.on{display:block}
.msg.ok{background:#22c55e22;color:#86efac}
/* Pantalla de entrada */
.hero{min-height:100%;display:grid;align-content:center;gap:22px;max-width:420px;margin:0 auto}
.lg{width:64px;height:64px;border-radius:18px;object-fit:contain;background:var(--c2);padding:6px}
.orb{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--c1);border:1px solid var(--ln);position:relative}
.orb::after{content:"";position:absolute;inset:-1px;border-radius:26px;border:2px solid var(--a);opacity:.55;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.08);opacity:0}}
/* Carnet */
.carnet{position:relative;border-radius:26px;padding:20px;background:var(--c1);border:1px solid var(--ln);overflow:hidden;display:grid;gap:14px;justify-items:center;text-align:center}
.carnet::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--a)}
.carnet::after{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 45%,#ffffff12 50%,transparent 55%);animation:sh 4s infinite;pointer-events:none}
@keyframes sh{from{transform:translateX(-50%)}to{transform:translateX(50%)}}
.qr{overflow:hidden;background:#fff;padding:12px;border-radius:18px;width:min(230px,62vw);cursor:pointer}
.qr svg{display:block;width:100%;height:auto}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12px;background:var(--c2)}
.pill.ok{color:var(--ok)}.pill.wa{color:var(--wa)}.pill.ko{color:var(--ko)}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}
.ring .bk{stroke:var(--c2)}.ring .fg{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,1,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;line-height:1;text-align:center}
.ring b small{display:block;font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st>div{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px}
.st b{font-size:22px;display:block}
/* Negocios */
.negs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.negs::-webkit-scrollbar{display:none}
.neg{flex:none;display:flex;gap:8px;align-items:center;padding:7px 12px 7px 7px;border-radius:999px;background:var(--c1);border:1px solid var(--ln);font-weight:700;font-size:13px;cursor:pointer}
.neg.on{border-color:var(--a);background:var(--c2)}
.neg i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--c2);overflow:hidden}
.neg i img{width:100%;height:100%;object-fit:cover}
/* Rutina */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:14px;padding:10px 0;background:var(--c1);font-weight:800;font-size:13px;cursor:pointer;position:relative}
.day.on{background:var(--a);color:#fff}.day.hoy::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.day.vac{opacity:.35}.day.on.vac{opacity:1}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--c2);font-size:12px;font-weight:800;color:var(--a)}
.li.hecho .dot{background:var(--a);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width 1s}
.vacio{text-align:center;padding:34px 16px;display:grid;gap:8px;justify-items:center}
.vacio .e{font-size:42px}
/* Barra inferior */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;background:#0d0d0fe8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:24px;padding:6px;max-width:480px;margin:0 auto}
.tab{flex:1;border:0;background:none;border-radius:18px;padding:8px 0 6px;display:grid;gap:2px;justify-items:center;font-size:11px;font-weight:700;color:var(--mu);cursor:pointer}
.tab span{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
.tab.on{background:var(--c2);color:var(--tx)}.tab.on span{filter:none;opacity:1}
.wrap{max-width:480px;margin:0 auto}
/* Hoja */
.ov{position:fixed;inset:0;background:#000c;display:grid;align-items:end;z-index:9;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{background:var(--c1);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-width:520px;width:100%;margin:0 auto;animation:up .3s cubic-bezier(.2,1,.3,1);max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.qrfull{position:fixed;inset:0;background:#fff;z-index:10;display:grid;place-items:center;gap:16px;align-content:center;color:#000;text-align:center;padding:20px}
.qrfull svg{width:min(80vw,420px);height:auto}
.demo{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:18px;z-index:5;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--wa);color:#000}
.pronto{border-style:dashed}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--c2);border:1px solid var(--ln);padding:10px 16px;border-radius:14px;font-size:14px;z-index:11;animation:in .3s}
</style>
</head>
<body>
<div id="app"><div class="scr"><div class="hero" style="justify-items:center"><div class="orb"><img src="/img/marca/logo-xyrostudio-app.svg" width="48" height="48" alt=""></div></div></div></div>
<script>
/* Mi Xyro · app de socios y pacientes de los negocios con Xyro Apps (SQL 45: xa_yo*, xa_personas, xa_yo_socios).
   La persona entra con celular + clave (cuenta <cel>@socio.xyrostudio.net, sin correo). Fases futuras: mapa, promos, puntos. */
'use strict';
const SB={url:'https://szvdzcaoxjstdyblhxrd.supabase.co',key:'sb_publishable_LOmoV7GDpORg5J1eE7YriA_tB4Y6EYe'};
const DOM='@socio.xyrostudio.net',P=new URLSearchParams(location.search);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k){try{return localStorage.getItem(k)}catch(_){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}};
const cel=t=>String(t||'').replace(/\D/g,'').slice(-9);
const hoyL=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10); // Lima
const fF=(d,o)=>new Date(String(d).length===10?d+'T12:00:00-05:00':d).toLocaleDateString('es-PE',{timeZone:'America/Lima',...(o||{day:'numeric',month:'short',year:'numeric'})});
const fH=d=>new Date(d).toLocaleTimeString('es-PE',{timeZone:'America/Lima',hour:'numeric',minute:'2-digit'});
const dias=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const money=n=>'S/ '+(Math.round(+n*100)/100).toLocaleString('es-PE',{minimumFractionDigits:0,maximumFractionDigits:2});
const js=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
const DIAS=[['d1','L','Lunes'],['d2','M','Martes'],['d3','M','Miércoles'],['d4','J','Jueves'],['d5','V','Viernes'],['d6','S','Sábado'],['d7','D','Domingo']];
const COMIDAS=[['desayuno','🌅','Desayuno'],['media','🍎','Media mañana'],['almuerzo','🍽️','Almuerzo'],['merienda','🥤','Media tarde'],['cena','🌙','Cena']];
const lineas=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const DEMO=P.get('demo');
let sb=null,D=null,TAB='inicio',CUR=+(ls.g('mi-neg')||0),INSTALL=null;

// ---------- Datos ----------
async function cliente(){
 if(sb)return sb;
 await js('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
 sb=supabase.createClient(SB.url,SB.key,{auth:{storageKey:'xyro-mi-auth',persistSession:true,autoRefreshToken:true}});
 return sb;
}
async function cargar(){
 if(DEMO){D=demoData();return D}
 const{data,error}=await sb.rpc('xa_yo');
 if(error)throw error;
 if(!data)return null;
 D=data;ls.s('mi-data',JSON.stringify(data));return D;
}
const negs=()=>(D&&D.negocios)||[];
const N=()=>negs()[Math.min(CUR,negs().length-1)]||null;
const dental=n=>(n||N()||{}).rubro==='consultorio';
function acento(n){const c=n&&n.color&&/^#[0-9a-f]{6}$/i.test(n.color)?n.color:'#7c5cff';document.documentElement.style.setProperty('--a',c)}
const logoURL=l=>l&&(/^https:\/\//.test(l)||l.startsWith('/'))?l:'';
function memAct(n){const h=hoyL(),L=(n.membresias||[]).slice().sort((a,b)=>a.inicio>b.inicio?1:-1);
 const act=L.find(m=>m.inicio<=h&&m.fin>=h)||null,sig=L.find(m=>m.inicio>h)||null,ult=L[L.length-1]||null;
 return{act,sig,ult,fin:L.reduce((a,m)=>m.fin>a?m.fin:a,'')}}
function saldo(n){let t=0,v=null;(n.membresias||[]).forEach(m=>(m.cuotas||[]).forEach(q=>{if(!q.pagado){t+= +q.monto||0;if(!v||q.vence<v)v=q.vence}}));return{t,v}}

// ---------- Entrada ----------
function pantallaEntrada(msg){
 acento(null);
 app.innerHTML=`<div class="scr"><div class="hero in">
  <div class="orb"><img src="/img/marca/logo-xyrostudio-app.svg" width="48" height="48" alt=""></div>
  <div class="g" style="gap:6px"><h1>Tu gym, tu consultorio y más,<br>en tu celular.</h1><p class="mu">Tu QR de entrada, tu plan, tus rutinas y tus citas en un solo lugar.</p></div>
  <form class="g" id="fl" autocomplete="on">
   <label>Celular<input id="lc" inputmode="numeric" autocomplete="tel" placeholder="9XX XXX XXX" maxlength="15" required></label>
   <label>Clave<input id="lp" type="password" autocomplete="current-password" required minlength="6"></label>
   <div class="msg" id="lm"></div>
   <button class="btn p" id="lb">Entrar</button>
  </form>
  <div class="card" style="gap:6px"><h3>¿Primera vez?</h3><p class="mu sm">Abre el enlace que te envió tu gimnasio o consultorio, o escribe aquí el código de tu carnet.</p>
   <div class="row"><input id="lk" placeholder="Código del carnet" style="text-transform:uppercase" maxlength="20"><button class="btn" id="lkb">Ir</button></div></div>
  <p class="mu xs" style="text-align:center">¿Quieres verla antes? <a href="?demo=1" style="color:var(--a)">Mira la demo</a> · Hecho por XyroStudio</p>
 </div></div>`;
 const m=$('#lm');if(msg){m.textContent=msg;m.classList.add('on')}
 const sv=ls.g('mi-cel');if(sv)$('#lc').value=sv;
 $('#lkb').onclick=()=>{const k=codigoDe($('#lk').value);if(k)location.href='?c='+k};
 $('#fl').onsubmit=async e=>{e.preventDefault();const c=cel($('#lc').value),p=$('#lp').value,b=$('#lb');m.className='msg';
  if(c.length!==9||c[0]!=='9'){m.textContent='Escribe tu celular de 9 dígitos.';m.classList.add('on');return}
  b.disabled=true;b.textContent='Entrando…';
  try{await cliente();const em=c+DOM;
   const w=await rpc0('xa_login_espera',{p_email:em});if(w>0)throw{u:`Demasiados intentos. Espera ${Math.ceil(w/60)} min.`};
   const{error}=await sb.auth.signInWithPassword({email:em,password:p});
   if(error){rpc0('xa_login_fallo',{p_email:em,p_ua:navigator.userAgent.slice(0,200)});throw{u:'Celular o clave incorrectos. ¿La olvidaste? Abre otra vez el enlace de tu negocio y crea una nueva.'}}
   ls.s('mi-cel',c);await entrar();
  }catch(er){m.textContent=er&&er.u||'Sin conexión. Revisa tu internet.';m.classList.add('on');b.disabled=false;b.textContent='Entrar'}};
}
async function rpc0(f,a){try{const{data,error}=await sb.rpc(f,a);return error?0:(data|0)}catch(_){return 0}}
const codigoDe=t=>{t=String(t||'').trim();const m=t.match(/[?&]c=([A-Za-z0-9]+)/);return(m?m[1]:t).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20)};
const ERR={celular:'Escribe tu celular de 9 dígitos (empieza con 9).',clave:'Tu clave debe tener al menos 6 caracteres.',codigo:'Ese enlace no es válido. Pide uno nuevo en recepción.',
 dato:'Ese celular no es el que diste en el negocio. Usa ese número o escribe tu DNI.',otro:'Este carnet ya está unido a otra cuenta. Pide ayuda en recepción.',
 equipo:'Ese número es de una cuenta del equipo del negocio. Usa tu celular personal.',reset:'Para crear una clave nueva escribe tu DNI.',espera:'Demasiados intentos. Espera un rato y vuelve a probar.'};
const errDe=e=>{const t=String(e&&(e.message||e.error)||e||'');for(const k in ERR)if(t===k||t.includes(k))return ERR[k];return 'Algo falló. Revisa tu internet y vuelve a intentar.'};

async function pantallaInvitacion(code){
 app.innerHTML='<div class="scr"><div class="hero" style="justify-items:center"><div class="orb"><img src="/img/marca/logo-xyrostudio-app.svg" width="48" height="48" alt=""></div></div></div>';
 let inv=null;
 try{await cliente();const{data,error}=await sb.rpc('xa_yo_invitacion',{p_codigo:code});if(error)throw error;inv=data}
 catch(e){return pantallaEntrada(errDe(e)==ERR.espera?ERR.espera:'No pudimos abrir tu invitación. Revisa tu internet.')}
 if(!inv)return pantallaEntrada(ERR.codigo);
 const{data:{session}}=await sb.auth.getSession();
 if(session){const r=await sb.rpc('xa_yo_vincular',{p_codigo:code});if(r.data&&r.data.ok){history.replaceState(0,'','./');toast('✅ '+inv.negocio+' agregado');return entrar(inv.negocio)}}
 acento(inv);const lg=logoURL(inv.logo),dent=inv.rubro==='consultorio';
 app.innerHTML=`<div class="scr"><div class="hero in">
  ${lg?`<img class="lg" src="${esc(lg)}" alt="">`:`<div class="orb" style="font-size:36px">${dent?'🦷':'🏋️'}</div>`}
  <div class="g" style="gap:6px"><p class="mu sm" style="font-weight:700;color:var(--a)">${esc(inv.negocio)}</p>
   <h1>Hola ${esc(inv.nombre)} 👋<br>${inv.cuenta?'Entra a tu app':'Crea tu cuenta'}</h1>
   <p class="mu">${dent?'Tus citas y tu tratamiento':'Tu QR de entrada, tu plan, tus rutinas y tu dieta'} siempre en tu celular. Solo te toma 10 segundos.</p></div>
  <form class="g" id="fi">
   <label>Tu celular<input id="ic" inputmode="numeric" autocomplete="tel" placeholder="El que diste en ${dent?'el consultorio':'recepción'}" maxlength="15" required></label>
   <label id="idw" style="${inv.pide_dni?'':'display:none'}">DNI<input id="id" inputmode="numeric" maxlength="12" placeholder="Tu número de DNI"></label>
   <label>${inv.cuenta?'Tu clave (o crea una nueva)':'Crea una clave'}<input id="ip" type="password" autocomplete="new-password" minlength="6" required placeholder="Mínimo 6 caracteres"></label>
   <div class="msg" id="im"></div>
   <button class="btn p" id="ib">${inv.cuenta?'Entrar':'Crear mi cuenta'}</button>
  </form>
  <p class="mu xs" style="text-align:center">Tus datos solo los ve ${esc(inv.negocio)}. XyroStudio no los vende ni comparte.</p>
 </div></div>`;
 const m=$('#im'),b=$('#ib');
 $('#fi').onsubmit=async e=>{e.preventDefault();m.className='msg';const c=cel($('#ic').value),p=$('#ip').value,dni=$('#id').value.replace(/\D/g,'')||null,em=c+DOM;
  if(c.length!==9||c[0]!=='9'){m.textContent=ERR.celular;m.classList.add('on');return}
  if(p.length<6){m.textContent=ERR.clave;m.classList.add('on');return}
  b.disabled=true;b.textContent='Un momento…';
  try{
   // ¿Ya tiene cuenta con esa clave? Entra y suma este negocio.
   let ok=false;if(inv.cuenta){const r=await sb.auth.signInWithPassword({email:em,password:p});ok=!r.error}
   if(ok){const r=await sb.rpc('xa_yo_vincular',{p_codigo:code,p_dni:dni});if(r.error)throw r.error;if(r.data&&r.data.error)throw r.data.error}
   else{const r=await sb.rpc('xa_yo_registro',{p_codigo:code,p_cel:c,p_pass:p,p_nombre:null,p_dni:dni});if(r.error)throw r.error;if(r.data&&r.data.error)throw r.data.error;
    const s=await sb.auth.signInWithPassword({email:em,password:p});if(s.error)throw s.error}
   ls.s('mi-cel',c);history.replaceState(0,'','./');await entrar(inv.negocio);
  }catch(er){const k=String(er&&er.message||er);if(k==='dato'||k==='reset')$('#idw').style.display='';
   m.textContent=errDe(er);m.classList.add('on');b.disabled=false;b.textContent=inv.cuenta?'Entrar':'Crear mi cuenta'}};
}

async function entrar(negocio){
 try{await cargar()}catch(e){const c=ls.g('mi-data');if(c){D=JSON.parse(c);toast('Sin conexión: mostrando lo último guardado')}else return pantallaEntrada('Sin conexión. Revisa tu internet.')}
 if(!D){await sb.auth.signOut();return pantallaEntrada('Tu cuenta aún no tiene negocios. Abre el enlace que te envió tu negocio.')}
 if(negocio){const i=negs().findIndex(n=>n.negocio===negocio);if(i>=0)CUR=i}
 pinta();
}

// ---------- App ----------
const TABS=()=>dental()?[['inicio','🏠','Inicio'],['citas','📅','Citas'],['trat','🦷','Tratamiento'],['perfil','👤','Perfil']]
 :[['inicio','🏠','Inicio'],['rutina','🏋️','Rutina'],['dieta','🥗','Dieta'],['perfil','👤','Perfil']];
function pinta(){
 const n=N();acento(n);if(!TABS().some(t=>t[0]===TAB))TAB='inicio';
 const V={inicio:vInicio,rutina:vRutina,dieta:vDieta,citas:vCitas,trat:vTrat,perfil:vPerfil}[TAB]||vInicio;
 app.innerHTML=`${DEMO?'<span class="demo">DEMO</span>':''}<div class="scr" id="sc"><div class="wrap in">${barraNeg()}${n?V(n):vSin()}</div></div>
 <nav class="tabs">${TABS().map(([k,i,t])=>`<button class="tab${k===TAB?' on':''}" data-t="${k}"><span>${i}</span>${t}</button>`).join('')}</nav>`;

function agregar(){
 if(DEMO)return toast('En la demo no se agregan negocios');
 hoja(`<h2>＋ Agregar negocio</h2><p class="mu sm">Escribe el código de tu carnet o pega el enlace que te enviaron.</p><input id="ak" placeholder="Código o enlace" style="text-transform:uppercase"><input id="ad" inputmode="numeric" placeholder="Tu DNI" style="display:none"><div class="msg" id="am"></div><button class="btn p" id="ab">Agregar</button><button class="btn l" data-x>Cancelar</button>`,(o,close)=>{
  const m=o.querySelector('#am'),b=o.querySelector('#ab');
  b.onclick=async()=>{const k=codigoDe(o.querySelector('#ak').value),dni=o.querySelector('#ad').value.replace(/\D/g,'')||null;if(k.length<8){m.textContent='Revisa el código.';m.className='msg on';return}
   b.disabled=true;try{const r=await sb.rpc('xa_yo_vincular',{p_codigo:k,p_dni:dni});if(r.error)throw r.error;if(r.data&&r.data.error)throw r.data.error;
    close();await cargar();CUR=negs().length-1;ls.s('mi-neg',CUR);TAB='inicio';pinta();toast('✅ Negocio agregado')}
   catch(er){if(String(er&&er.message||er)==='dato')o.querySelector('#ad').style.display='';m.textContent=errDe(er);m.className='msg on';b.disabled=false}}})}
function quitar(i){const x=negs()[i];if(!x)return;hoja(`<h2>¿Quitar ${esc(x.negocio)}?</h2><p class="mu">Solo se quita de tu app. Tu membresía y tus datos en el negocio siguen igual.</p><button class="btn" id="qy" style="color:var(--ko)">Sí, quitar</button><button class="btn l" data-x>Cancelar</button>`,(o,close)=>{
 o.querySelector('#qy').onclick=async()=>{await sb.rpc('xa_yo_quitar',{p_cliente:x.cliente});close();CUR=0;ls.s('mi-neg',0);await cargar();pinta()}})}
async function salir(){try{await sb.auth.signOut()}catch(_){}ls.s('mi-data',null);ls.s('mi-neg',null);D=null;pantallaEntrada()}
