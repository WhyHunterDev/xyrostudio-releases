<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07070d"><meta name="robots" content="noindex">
<title>Xyro Apps</title><link rel="icon" href="/img/marca/logo-apps-app.svg"><link rel="manifest" href="/app/manifest.webmanifest">
<style>html,body{margin:0;height:100%;background:#07070d}body{display:grid;place-items:center}img{width:56px;height:56px;opacity:.85;animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}</style></head>
<body><img src="/img/marca/logo-apps-app.svg" alt="">
<script>
/* Xyro Apps: elige la versión que el gestor le subió a este negocio y la abre (SQL 28, xa_version). Sin respuesta usa la última conocida. */
(async()=>{
 const SUB='',FALLBACK='20261113-0422',SB={url:'https://szvdzcaoxjstdyblhxrd.supabase.co',key:'sb_publishable_LOmoV7GDpORg5J1eE7YriA_tB4Y6EYe'};
 const g=k=>{try{return localStorage.getItem(k)||''}catch(_){return''}},P=new URLSearchParams(location.search);
 let v=g('xa-ver')||FALLBACK;
 // La demo siempre abre la versión más nueva (no tiene negocio real; así nadie usa una demo vieja sin protecciones).
 if(P.get('demo')||P.get('prueba'))try{const r=await fetch('/app/v/versiones.json',{cache:'no-store'});const L=await r.json();if(L[0]&&/^[\w-]+$/.test(L[0].id))v=L[0].id}catch(_){}
 else try{
  const slug=P.get('s')||g('xa-slug')||null,h={apikey:SB.key,'Content-Type':'application/json'};
  try{const t=JSON.parse(g('xyro-apps-auth')||'null');if(t&&t.access_token&&t.expires_at*1000>Date.now()+30000)h.Authorization='Bearer '+t.access_token}catch(_){}
  const c=new AbortController();setTimeout(()=>c.abort(),2500);
  const r=await fetch(SB.url+'/rest/v1/rpc/xa_version',{method:'POST',headers:h,body:JSON.stringify({p_slug:slug}),signal:c.signal});
  if(r.ok){const x=await r.json();if(typeof x==='string'&&/^[\w-]+$/.test(x)){v=x;try{localStorage.setItem('xa-ver',x)}catch(_){}}}
 }catch(_){}
 location.replace('/app/v/'+v+'/'+SUB+location.search+location.hash);
})();
</script></body></html>
