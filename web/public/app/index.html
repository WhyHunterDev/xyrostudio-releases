<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xyro Apps</title>
<meta name="description" content="Xyro Apps: socios, membresías, cobros y asistencia con QR para tu negocio. Primero Xyro Gym.">
<meta name="theme-color" content="#07070d">
<link rel="icon" href="../img/marca/logo-apps-app.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--a:#3ad6ff;--b:#7c5cff;--bg:#07070d;--c1:#10101a;--c2:#161624;--ln:#ffffff14;--tx:#eef0f8;--mu:#8d8fa8;--ok:#3ddc97;--wa:#f5b544;--bad:#ff5c7a;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.22;animation:fl 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b);left:-20vmax;top:-25vmax}
.bg i:nth-child(2){background:var(--a);right:-25vmax;bottom:-30vmax;animation-delay:-8s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.grad{background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
/* layout */
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
#app[hidden],[hidden]{display:none!important}
aside{border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:#07070daa;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:36px;height:36px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:var(--mu);font-size:12px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mu);font-weight:600;transition:.2s;position:relative}
.nav:hover{background:#ffffff08;color:var(--tx)}
.nav.on{color:var(--tx);background:linear-gradient(90deg,#7c5cff33,#3ad6ff14)}
.nav.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--b),var(--a))}
.nav em{font-style:normal;font-size:18px;width:22px;text-align:center}
.side-f{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--mu);padding:8px}
main{overflow:auto;height:100%;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 26px;background:linear-gradient(#07070df2,#07070d99);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.top h1{font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.srch{display:flex;align-items:center;gap:8px;background:#ffffff0a;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;width:min(300px,40vw)}
.srch input{background:none;border:0;outline:0;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;background:#ffffff10;border:1px solid var(--ln);transition:.2s;white-space:nowrap}
.btn:hover{background:#ffffff1a;transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--b),var(--a));border:0;color:var(--on,#fff);box-shadow:0 8px 30px -10px var(--a)}
.btn.ok{background:#3ddc9722;border-color:#3ddc9755;color:var(--ok)}
.btn.bad{background:#ff5c7a1a;border-color:#ff5c7a44;color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.v{padding:24px 26px 110px;max-width:1240px;animation:vin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.st>*{animation:vin .5s both}.st>*:nth-child(2){animation-delay:.05s}.st>*:nth-child(3){animation-delay:.1s}.st>*:nth-child(4){animation-delay:.15s}.st>*:nth-child(5){animation-delay:.2s}.st>*:nth-child(6){animation-delay:.25s}
.hi{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hi h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;line-height:1.1}
.mu{color:var(--mu)}.sm{font-size:13px}
.g{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.6fr 1fr}
.card{background:linear-gradient(160deg,#ffffff0d,#ffffff04);border:1px solid var(--ln);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi{cursor:pointer;transition:.25s}
.kpi:hover{transform:translateY(-3px);border-color:#ffffff2a}
.kpi small{color:var(--mu);font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center}
.kpi b{display:block;font-size:32px;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi i{position:absolute;right:-18px;top:-18px;width:90px;height:90px;border-radius:50%;filter:blur(30px);opacity:.5}
.kpi .tr{font-size:12px;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px #0000}}
.ch{width:100%;height:150px;display:block}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.bars{display:flex;align-items:end;gap:4px;height:120px}
.bars div{flex:1;border-radius:6px 6px 2px 2px;background:#ffffff14;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) both;position:relative}
.bars div.now{background:linear-gradient(var(--a),var(--b))}
.bars div.pk{background:#7c5cff88}
@keyframes gr{from{transform:scaleY(0)}}
.hrs{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;transition:.2s}
.row:hover{background:#ffffff08}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--mu);font-size:12.5px}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:#fff;background:linear-gradient(135deg,hsl(var(--h),80%,60%),hsl(calc(var(--h) + 50),80%,45%))}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.act{background:#3ddc971f;color:var(--ok)}.pill.pronto{background:#f5b5441f;color:var(--wa)}.pill.venc{background:#ff5c7a1f;color:var(--bad)}.pill.sin{background:#ffffff10;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--ln);background:#ffffff08;font-weight:600;font-size:13.5px;transition:.2s}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.chip span{opacity:.6;margin-left:4px}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
.empty b{display:block;font-size:40px;margin-bottom:8px}
/* ficha */
.fx{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.pf{text-align:center;display:grid;gap:14px;justify-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .rv{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:34px;line-height:1}.ring small{color:var(--mu);font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.hm{max-width:520px;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:4px;background:#ffffff0c}
.hm i.y{background:linear-gradient(135deg,var(--b),var(--a));box-shadow:0 0 10px -2px var(--a)}
.tl{display:grid;gap:2px}
.tl .row{padding:9px 10px}
/* planes */
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.plan{padding:20px;border-radius:var(--r);border:1px solid var(--ln);background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 22%,transparent),#ffffff05);position:relative;overflow:hidden;cursor:pointer;transition:.25s}
.plan:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--pc)}
.plan b{font-size:18px}.plan .pr{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0}
.plan .pr small{font-size:14px;color:var(--mu);font-weight:600}
/* caja */
.mb{display:grid;gap:10px}
.mb div{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.mb span{height:10px;border-radius:9px;background:#ffffff10;overflow:hidden}
.mb span i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--b),var(--a));animation:gw 1s both}
@keyframes gw{from{width:0!important}}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
/* modal */
.ov{position:fixed;inset:0;z-index:40;background:#0009;backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{width:min(480px,100%);max-height:92vh;overflow:auto;background:#12121d;border:1px solid #ffffff1f;border-radius:22px;padding:22px;display:grid;gap:12px;animation:pop .35s cubic-bezier(.2,1.2,.3,1);box-shadow:0 40px 120px -20px #000}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
.sh h3{font-size:20px;letter-spacing:-.02em}
.fl{display:grid;gap:5px;font-size:13px;color:var(--mu);font-weight:600}
.fl input,.fl select,.fl textarea{padding:12px 13px;border-radius:12px;border:1px solid var(--ln);background:#0007;outline:0;width:100%;color:var(--tx);transition:.2s}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #3ad6ff22}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{padding:9px 12px;border-radius:11px;border:1px solid var(--ln);background:#ffffff08;font-weight:600;font-size:13.5px}
.opts button.on{border-color:var(--a);background:#3ad6ff1f;color:#fff}
.sh .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.qr{background:#fff;padding:14px;border-radius:16px;width:220px;margin:0 auto}
.qr svg{width:100%;height:auto;display:block}
.carnet{border-radius:22px;padding:20px;background:linear-gradient(135deg,var(--b),#1b1b2e 55%,var(--a));display:grid;gap:12px;text-align:center;position:relative;overflow:hidden}
.carnet::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#ffffff30 50%,transparent 60%);animation:sh 3.5s infinite}
@keyframes sh{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
/* kiosco */
#kio{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 30%,#1a1640,#05050a 70%);display:grid;grid-template-rows:auto 1fr auto;padding:24px;text-align:center}
#kio .clk{font-size:clamp(46px,9vw,92px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.kpad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center;margin:20px auto}
.kpad button{height:72px;border-radius:20px;background:#ffffff0d;border:1px solid var(--ln);font-size:26px;font-weight:700;transition:.1s}
.kpad button:active{transform:scale(.92);background:#ffffff22}
.kin{font-size:34px;font-weight:800;letter-spacing:.18em;min-height:50px;border-bottom:2px solid #ffffff22;width:min(340px,80vw);margin:0 auto;padding:6px}
.kres{position:fixed;inset:0;z-index:70;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;animation:fd .25s;padding:20px}
.kres.ok{background:radial-gradient(circle,#0d4d36,#05050a 70%)}.kres.no{background:radial-gradient(circle,#5a1222,#05050a 70%)}
.kres .bd{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:72px;animation:pop .5s cubic-bezier(.2,1.6,.3,1)}
.kres.ok .bd{background:#3ddc9733;box-shadow:0 0 0 0 #3ddc9788;animation:pop .5s cubic-bezier(.2,1.6,.3,1),rp 1.2s .2s}
.kres.no .bd{background:#ff5c7a33}
@keyframes rp{to{box-shadow:0 0 0 60px #3ddc9700}}
.kres h2{font-size:clamp(30px,6vw,56px);letter-spacing:-.03em;line-height:1.05}
.cf{position:fixed;width:10px;height:14px;top:-20px;z-index:80;animation:cf linear forwards;border-radius:2px}
@keyframes cf{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
#cam{width:min(360px,80vw);border-radius:20px;margin:0 auto;display:block;aspect-ratio:1;object-fit:cover}
/* login / boot */
.cen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:30}
.lg{width:min(400px,100%);display:grid;gap:14px;text-align:center}
.lg .card{text-align:left;display:grid;gap:12px;padding:22px}
.lg img{width:72px;height:72px;margin:0 auto;animation:sp 6s ease-in-out infinite}
@keyframes sp{50%{transform:rotate(8deg) scale(1.06)}}
#boot img{width:84px;animation:bt 1.3s ease-in-out infinite}
@keyframes bt{50%{transform:scale(.88);filter:drop-shadow(0 0 30px var(--a))}}
.err{color:var(--bad);font-size:14px}
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:10px;align-items:center;padding:8px 8px 8px 16px;border-radius:999px;background:#12121df0;border:1px solid #ffffff22;backdrop-filter:blur(10px);font-size:13px;box-shadow:0 20px 50px -10px #000;white-space:nowrap}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);z-index:90;padding:12px 18px;border-radius:14px;background:#12121d;border:1px solid #ffffff22;font-weight:700;transition:.35s cubic-bezier(.2,1.4,.3,1);box-shadow:0 20px 50px -10px #000;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
.bn{display:none}
.drop{display:block;border:2px dashed #ffffff26;border-radius:18px;padding:28px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.on{border-color:var(--a);background:#ffffff08}
.imp .sc{overflow:auto;max-height:220px;border:1px solid var(--ln);border-radius:12px}.imp table{width:100%;border-collapse:collapse;font-size:12.5px}.imp td,.imp th{padding:7px 9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.sh.wide{width:min(760px,100%)}
.tk{width:100%;height:330px;border:0;border-radius:14px;background:#fff}
.num{font-size:11px;font-weight:800;color:var(--a);background:#ffffff10;padding:2px 7px;border-radius:7px;margin-right:6px;font-variant-numeric:tabular-nums}
.sw{width:30px;height:30px;border-radius:10px;display:inline-block;border:2px solid #fff3;vertical-align:middle}
.lgo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#fff1;padding:4px}
.btn.p,.chip.on.p{color:var(--on,#fff)}
@media (max-width:900px){.k4{grid-template-columns:1fr 1fr}.g2,.fx{grid-template-columns:1fr}}
@media (max-width:720px){
 #app{grid-template-columns:1fr}
 aside{display:none}
 .bn{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:15;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#0a0a12f2;backdrop-filter:blur(16px);border-top:1px solid var(--ln)}
 .bn a{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 8px;border-radius:10px}
 .bn a em{font-style:normal;font-size:20px}
 .bn a.on{color:var(--tx)}.bn a.on em{filter:drop-shadow(0 0 8px var(--a))}
 .top{padding:12px 16px}.v{padding:18px 16px 120px}
 .srch{display:none}
 .kpi b{font-size:26px}
 .demo{bottom:78px;font-size:12px}
 .f2{grid-template-columns:1fr}
 .mb div{grid-template-columns:90px 1fr 76px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="bg"><i></i><i></i></div>

  <div class="lg">

<script>

 gym:{n:'Gimnasio',ico:'🏋️',cli:'Socio',clis:'Socios',plan:'Membresía',demo:'Titan Gym',lema:'¡Sigue entrenando! 💪',

 consultorio:{n:'Consultorio',ico:'🩺',cli:'Paciente',clis:'Pacientes',plan:'Paquete',demo:'Clínica Sonríe',lema:'Te esperamos en tu próxima cita 😊',

 academia:{n:'Academia',ico:'🎓',cli:'Alumno',clis:'Alumnos',plan:'Mensualidad',demo:'Academia Vértice',lema:'¡A seguir aprendiendo! 📚',

};

const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};

const DKEY=()=>'xa-demo-'+(CFG.rubro||'gym');
const saveDemo=()=>LS.s(DKEY(),{S,CFG});
const fixErr=e=>/column|xa_series|xa_siguiente|schema cache/i.test(e.message||'')?new Error('Falta correr el SQL 16 en Supabase.'):e;
const DB={
 async load(){
  if(DEMO)return;
  const since=new Date(Date.now()-150*864e5).toISOString();
  const q=t=>sb.from(T[t]).select('*').eq('sitio_id',SID);
  const rs=await Promise.all([q('cli').order('nombre').limit(5000),q('pla').order('precio'),q('mem').order('fin',{ascending:false}).limit(10000),q('pag').gte('fecha',since).order('fecha',{ascending:false}).limit(5000),q('asi').gte('t',since).order('t',{ascending:false}).limit(20000)]);
  const e=rs.find(r=>r.error);if(e){if(/xa_|relation|schema cache/i.test(e.error.message))throw new Error('Falta activar la base de Xyro Apps (SQL 15).');throw e.error}
  [S.cli,S.pla,S.mem,S.pag,S.asi]=rs.map(r=>r.data||[]);
 },
 async ins(t,row){
  if(DEMO){row.id=row.id||uid();S[t].unshift(row);saveDemo();return row}
  row.sitio_id=SID;const{data,error}=await sb.from(T[t]).insert(row).select().single();if(error)throw fixErr(error);S[t].unshift(data);return data;
 },
 async upd(t,id,p){
  const i=S[t].findIndex(x=>x.id===id);
  if(!DEMO){const{error}=await sb.from(T[t]).update(p).eq('id',id);if(error)throw fixErr(error)}
  if(i>=0)Object.assign(S[t][i],p);if(DEMO)saveDemo();
 },
 async insMany(t,rows,prog){
  if(!rows.length)return;
  if(DEMO){S[t].push(...rows);saveDemo();prog&&prog(1);return}
  rows.forEach(r=>r.sitio_id=SID);
  for(let i=0;i<rows.length;i+=400){const{error}=await sb.from(T[t]).insert(rows.slice(i,i+400));if(error)throw fixErr(error);S[t].push(...rows.slice(i,i+400));prog&&prog(Math.min(1,(i+400)/rows.length))}
 },
 async del(t,id){
  if(!DEMO){const{error}=await sb.from(T[t]).delete().eq('id',id);if(error)throw error}
  S[t]=S[t].filter(x=>x.id!==id);
  if(t==='cli'){S.mem=S.mem.filter(x=>x.cliente_id!==id);S.asi=S.asi.filter(x=>x.cliente_id!==id)}
  if(DEMO)saveDemo();
 },
 async cfg(v){
  CFG=Object.assign(CFG,v);R=RUBROS[CFG.rubro]||RUBROS.gym;
  if(DEMO)return saveDemo();
  const{error}=await sb.from('contenido').upsert({sitio_id:SID,clave:'app',valor:CFG});if(error)throw error;
 }
};

const memDe=id=>{let m=null;for(const x of S.mem)if(x.cliente_id===id&&(!m||x.fin>m.fin))m=x;return m};
const est=c=>{const m=memDe(c.id);if(!m)return{k:'sin',t:'Sin '+R.plan.toLowerCase(),d:null,m};const d=diff(hoy(),m.fin);if(d<0)return{k:'venc',t:'Venció hace '+(-d)+' d',d,m};if(d<=5)return{k:'pronto',t:d===0?'Vence hoy':'Vence en '+d+' d',d,m};return{k:'act',t:d+' días',d,m}};
const cli=id=>S.cli.find(c=>c.id===id);
const plan=id=>S.pla.find(p=>p.id===id);
const nombre=()=>CFG.nombre||R.demo;
const waMsg=(c,e)=>`Hola ${String(c.nombre).split(' ')[0]} 👋, tu ${(e.m&&e.m.plan_nombre)||R.plan.toLowerCase()} en ${nombre()} ${e.d<0?'venció el':'vence el'} ${fF(e.m&&e.m.fin)}. Renueva y no pierdas el ritmo. ${R.lema}`;
const waLink=(c,msg)=>'https://wa.me/'+tel(c.telefono)+'?text='+encodeURIComponent(msg);
async function renovar(c,p,monto,metodo){
 const m=memDe(c.id),ini0=m&&m.fin>=hoy()?addD(m.fin,1):hoy();let pago=null;
 const mem=await DB.ins('mem',{cliente_id:c.id,plan_id:p.id,plan_nombre:p.nombre,inicio:ini0,fin:addD(ini0,Math.max(1,+p.dias)-1),precio:+monto,creado:new Date().toISOString()});
 if(+monto>0)pago=await DB.ins('pag',{cliente_id:c.id,membresia_id:mem.id,concepto:p.nombre,monto:+monto,metodo,fecha:new Date().toISOString(),quien:ME.nombre||ROLES[ME.rol]});
 return pago;
}
function checkin(v){
 v=String(v||'').trim().toUpperCase();if(!v)return null;
 const c=S.cli.find(x=>(x.codigo||'').toUpperCase()===v)||S.cli.find(x=>String(x.dni||'')===v)||S.cli.find(x=>x.num&&(String(x.num).toUpperCase()===v||(/^\d+$/.test(v)&&+x.num===+v)));
 if(!c)return{ok:false,t:'No encontramos ese código',s:'Acércate a recepción'};
 const e=est(c),ya=S.asi.find(a=>a.cliente_id===c.id&&Date.now()-new Date(a.t)<3*36e5);
 if(e.k==='venc'||e.k==='sin')return{ok:false,c,t:'Hola '+c.nombre.split(' ')[0],s:e.k==='sin'?'Aún no tienes '+R.plan.toLowerCase()+' activa':'Tu '+R.plan.toLowerCase()+' venció el '+fF(e.m.fin)+'. Renueva en recepción.'};
 if(ya)return{ok:true,c,t:'¡Ya estás dentro, '+c.nombre.split(' ')[0]+'!',s:'Registraste tu ingreso a las '+fH(ya.t)};
 DB.ins('asi',{cliente_id:c.id,t:new Date().toISOString(),quien:ME.nombre||''}).catch(er=>toast(er.message));
 return{ok:true,c,t:'¡Hola, '+c.nombre.split(' ')[0]+'!',s:e.k==='pronto'?'⚠️ '+e.t+'. ¡Renueva hoy!':'Te quedan '+e.d+' días de '+R.plan.toLowerCase()+'.',warn:e.k==='pronto'};
}

/* ===== UI base ===== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function countUp(root){(root||document).querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,f=el.dataset.f,t0=performance.now(),D=900;const st=t=>{const k=Math.min(1,(t-t0)/D),v=to*(1-Math.pow(1-k,3));el.textContent=f==='s'?sol(Math.round(v)):Math.round(v).toLocaleString('es-PE');if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function area(vals,w=600,h=150){const mx=Math.max(1,...vals),n=vals.length-1||1;const pts=vals.map((v,i)=>(i*w/n).toFixed(1)+','+(h-8-(v/mx)*(h-24)).toFixed(1));const d='M'+pts.join('L');
 return`<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--a);stop-opacity:0"/></linearGradient><linearGradient id="gl"><stop offset="0" style="stop-color:var(--b)"/><stop offset="1" style="stop-color:var(--a)"/></linearGradient></defs><path d="${d}L${w},${h}L0,${h}Z" fill="url(#ga)"/><path d="${d}" class="ln" pathLength="1" fill="none" stroke="url(#gl)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
function sheet(html,onMount,cls){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh ${cls||''}">${html}</div>`;document.body.appendChild(o);const close=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-x]'))close()});onMount&&onMount(o.firstChild,close);return close}
/* Formulario genérico: campos [{k,l,t,v,o,req,ph}] */
function form(title,fields,onSave,extra){
 const fh=f=>{const id='f_'+f.k;if(f.t==='opts')return`<div class="fl">${f.l}<div class="opts" data-k="${f.k}">${f.o.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${String(o[0])===String(f.v)?'on':''}">${esc(o[1])}</button>`).join('')}</div></div>`;
  if(f.t==='sel')return`<label class="fl">${f.l}<select id="${id}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if(f.t==='chk')return`<label class="fl" style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input id="${id}" type="checkbox" ${f.v?'checked':''} style="width:20px;height:20px;accent-color:var(--a)">${f.l}</label>`;
  if(f.t==='area')return`<label class="fl">${f.l}<textarea id="${id}" rows="3">${esc(f.v)}</textarea></label>`;
  return`<label class="fl">${f.l}<input id="${id}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}" ${f.t==='number'?'step="any" min="0"':''} ${f.im?`inputmode="${f.im}"`:''}></label>`};
 const rows=[];for(let i=0;i<fields.length;i++){const f=fields[i];if(f.half&&fields[i+1]&&fields[i+1].half){rows.push(`<div class="f2">${fh(f)}${fh(fields[i+1])}</div>`);i++}else rows.push(fh(f))}
 sheet(`<form class="g" style="gap:12px"><h3>${title}</h3>${rows.join('')}<p class="err" hidden></p><div class="bt">${extra||''}<button type="button" class="btn" data-x>Cancelar</button><button class="btn p">Guardar</button></div></form>`,(el,close)=>{
  const fm=el.querySelector('form');
  fm.querySelectorAll('.opts').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));g.dispatchEvent(new Event('change'))}));
  const val=()=>{const o={};fields.forEach(f=>{if(f.t==='opts'){const b=fm.querySelector(`[data-k="${f.k}"] .on`);o[f.k]=b?b.dataset.v:''}else{const x=fm.querySelector('#f_'+f.k);o[f.k]=x?(x.type==='checkbox'?x.checked:x.value.trim()):''}});return o};
  fields.forEach(f=>f.on&&f.on(fm,val));
  setTimeout(()=>{const i=fm.querySelector('input');i&&i.focus()},80);
  fm.addEventListener('submit',async e=>{e.preventDefault();const b=fm.querySelector('.btn.p');b.disabled=true;try{await onSave(val(),fm);close()}catch(er){const p=fm.querySelector('.err');p.textContent=er.message||String(er);p.hidden=false;b.disabled=false}});
 });
}

function autoMap(hdr){

 CAMPOS.forEach(([k,,syn])=>{if(m[k]!=null)return;for(const s of syn){if(s.length<3)continue;const i=H.findIndex((h,j)=>!used.has(j)&&(' '+h+' ').includes(' '+s+' '));if(i>=0){put(k,i);break}}});

 sb=supabase.createClient(SB.url,SB.key,{auth:{storageKey:'xyro-apps-auth'}});
 const{data}=await sb.auth.getUser();if(!data||!data.user)return login();
 try{await entrar(data.user)}catch(er){fatal(er.message)}
}
function login(){
 $('#boot').hidden=true;$('#login').hidden=false;
 $('#lf').onsubmit=async e=>{e.preventDefault();const er=$('#lerr');er.hidden=true;const b=$('#lf .btn');b.disabled=true;
  try{const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)throw new Error('Correo o contraseña incorrectos.');await entrar(data.user)}catch(x){er.textContent=x.message;er.hidden=false;b.disabled=false}};
}
function fatal(m,extra){$('#boot').hidden=true;$('#login').hidden=true;const d=document.createElement('div');d.className='cen';d.innerHTML=`<div class="lg"><img src="../img/marca/logo-apps-app.svg" alt=""><h2>${m}</h2>${extra||''}<button class="btn" onclick="location.reload()">Reintentar</button></div>`;document.body.appendChild(d)}
async function entrar(u){
 const{data:p}=await sb.from('perfiles').select('*').eq('id',u.id).maybeSingle();
 if(!p||!ROLES[p.rol]||p.activo===false){await sb.auth.signOut();throw new Error('Esta cuenta no tiene acceso a Xyro Apps.')}
 ME=Object.assign({},p,{email:u.email,gestor:p.rol==='gestor'});
 let s;
 if(ME.gestor){
  const slug=P.get('s')||LS.g('xa-s','');
  if(!slug)return elegirSitio();
  s=(await sb.from('sitios').select('*').eq('slug',slug).maybeSingle()).data;if(!s){LS.r('xa-s');return elegirSitio()}
  LS.s('xa-s',slug);
 }else s=(await sb.from('sitios').select('*').eq('id',p.sitio_id).maybeSingle()).data;
 if(!s)throw new Error('No encontramos tu negocio.');
 SID=s.id;SLUG=s.slug;
 const{data:cs}=await sb.from('contenido').select('clave,valor').eq('sitio_id',SID);
 const C={};(cs||[]).forEach(r=>C[r.clave]=r.valor||{});
 const xy=(C.config&&C.config.xyros)||[];
 if(!ME.gestor&&!xy.includes('apps'))return fatal('Xyro Apps aún no está activo para tu negocio',`<a class="btn p" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Quiero activar Xyro Apps para '+(s.negocio||s.slug))}">Activarlo por WhatsApp</a>`);
 WEB=deWeb(C);
 CFG=Object.assign({rubro:'gym',nombre:WEB.nombre||s.negocio||s.slug},C.app||{});R=RUBROS[CFG.rubro]||RUBROS.gym;
 if(!CFG.web&&ME.gestor){try{const{data:ca}=await sb.from('clientes_agencia').select('url').ilike('url','%'+SLUG+'%').limit(1);CFG.web=ca&&ca[0]&&ca[0].url||''}catch(_){}}
 await DB.load();
 if(!ME.gestor)vigilarInactividad();
 start();
 if(CFG.syncWeb!==false&&await syncWeb(false))go();
}
async function elegirSitio(){
 const{data}=await sb.from('sitios').select('slug,negocio').order('negocio');
 fatal('¿Qué negocio abrimos?',`<div class="card tl" style="text-align:left">${(data||[]).map(s=>`<a class="row" href="?s=${encodeURIComponent(s.slug)}"><span class="av" style="--h:${hue(s.slug)}">${esc(ini(s.negocio||s.slug))}</span><span class="nm"><b>${esc(s.negocio||s.slug)}</b><small>${esc(s.slug)}</small></span>→</a>`).join('')}</div>`);
}
function vigilarInactividad(){let t;const r=()=>{clearTimeout(t);t=setTimeout(salir,36e5)};['click','keydown','touchstart'].forEach(e=>addEventListener(e,r,{passive:true}));r()}
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
</script>
