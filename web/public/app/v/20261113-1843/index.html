 const byDni=new Map(S.cli.filter(c=>c.dni).map(c=>[String(c.dni),c])),byNum=new Map(S.cli.filter(c=>c.num).map(c=>[String(c.num),c]));
 let next=+nextNum();const nuevos=[],memb=[],planes={};let existen=0;
 for(const r of rows){
  const nm=titulo(String(g(r,'nombre')||[g(r,'nombres'),g(r,'apellidos')].filter(Boolean).join(' ')).replace(/\s+/g,' ').trim());if(!nm)continue;
  const dni=String(g(r,'dni')||'').replace(/\D/g,'')||null,num=String(g(r,'num')||'').trim()||null;
  let c=(num&&byNum.get(num))||(dni&&byDni.get(dni));
  if(c)existen++;else{c={id:uid(),nombre:nm.slice(0,120),dni,num:num||String(next++),telefono:String(g(r,'telefono')||'').replace(/\D/g,'').slice(-9)||null,email:String(g(r,'email')||'').trim()||null,nacimiento:pDate(g(r,'nacimiento')),notas:String(g(r,'notas')||'').trim()||null,codigo:codigo(),creado:new Date().toISOString()};nuevos.push(c);dni&&byDni.set(dni,c);byNum.set(c.num,c)}
  const fin=pDate(g(r,'fin'));if(!fin)continue;
  let ini=pDate(g(r,'inicio'));const dias=ini&&ini<=fin?diff(ini,fin)+1:30;if(!ini||ini>fin)ini=addD(fin,-29);
  const pn=String(g(r,'plan')||'').trim()||'Plan importado',key=norm(pn),monto=pMonto(g(r,'monto'));
  (planes[key]=planes[key]||{nombre:pn,dias:[],precios:[]}).dias.push(dias);monto&&planes[key].precios.push(monto);
  if(S.mem.some(x=>x.cliente_id===c.id&&x.fin===fin))continue;
  memb.push({id:uid(),cliente_id:c.id,key,plan_nombre:pn,inicio:ini,fin,precio:monto,creado:new Date().toISOString()});
 }
 return{nuevos,memb,planes,existen};
}
const moda=a=>{const c={};let b=a[0],n=0;a.forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>n){n=c[x];b=x}});return b};
async function ejecutarImport(X,prog){
 let k=0;const pid={};
 for(const[key,p]of Object.entries(X.planes)){let ex=S.pla.find(x=>norm(x.nombre)===key);if(!ex)ex=await DB.ins('pla',{nombre:p.nombre,precio:moda(p.precios)||0,dias:moda(p.dias)||30,color:['#3ad6ff','#7c5cff','#3ddc97','#f5b544','#ff5c7a'][k++%5],activo:true});pid[key]=ex.id}
 prog(10);await DB.insMany('cli',X.nuevos,f=>prog(10+f*50));
 const mem=X.memb.map(({key,...m})=>Object.assign(m,{plan_id:pid[key]}));
 await DB.insMany('mem',mem,f=>prog(60+f*25));
 const pag=mem.filter(m=>+m.precio>0).map(m=>({id:uid(),cliente_id:m.cliente_id,membresia_id:m.id,concepto:m.plan_nombre,monto:+m.precio,metodo:'Importado',fecha:m.inicio+'T12:00:00',quien:'Importación'}));
 await DB.insMany('pag',pag,f=>prog(85+f*15));
 S.cli.sort((a,b)=>a.nombre.localeCompare(b.nombre));S.pla.sort((a,b)=>a.precio-b.precio);S.pag.sort((a,b)=>b.fecha>a.fecha?1:-1);
}

async function lectorQR(vid,onCode){

 if(!det&&!window.jsQR)await cargaJS('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const scan=async()=>{if(!kStream||my!==qrGen)return;if(!$('.kres')&&vid.videoWidth){try{
   if(det){const r=await det.detect(vid);r[0]&&onCode(r[0].rawValue)}
   else{const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.min(vw,vh)*.8,o=520;cv.width=o;cv.height=o;cx.drawImage(vid,(vw-s)/2,(vh-s)/2,s,s,0,0,o,o);const q=jsQR(cx.getImageData(0,0,o,o).data,o,o,{inversionAttempts:n++%2?'attemptBoth':'dontInvert'});q&&q.data&&onCode(q.data)}
  }catch(_){}}setTimeout(scan,200)};
 scan();
}
