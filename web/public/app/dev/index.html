function recorte(src,w,h){const s=Math.min(w,h),cv=document.createElement('canvas');cv.width=cv.height=360;cv.getContext('2d').drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,360,360);return cv.toDataURL('image/jpeg',.82)}
function fotoDe(file){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{ok(recorte(i,i.naturalWidth,i.naturalHeight));URL.revokeObjectURL(i.src)};i.onerror=()=>ko(new Error('Imagen no válida'));i.src=URL.createObjectURL(file)})}

async function lectorQR(vid,onCode){
 const my=++qrGen;let det=null,n=0;if('BarcodeDetector'in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(_){}}
 if(!det&&!window.jsQR)await cargaJS('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const scan=async()=>{if(!kStream||my!==qrGen)return;if(!$('.kres')&&vid.videoWidth){try{
   if(det){const r=await det.detect(vid);r[0]&&onCode(r[0].rawValue)}
   else{const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.min(vw,vh)*.8,o=520;cv.width=o;cv.height=o;cx.drawImage(vid,(vw-s)/2,(vh-s)/2,s,s,0,0,o,o);const q=jsQR(cx.getImageData(0,0,o,o).data,o,o,{inversionAttempts:n++%2?'attemptBoth':'dontInvert'});q&&q.data&&onCode(q.data)}
  }catch(_){}}setTimeout(scan,200)};
 scan();
}
