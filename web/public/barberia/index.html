 const diasTxt=()=>{const s=new Set();P.forEach(p=>(p.dias||[1,2,3,4,5,6]).forEach(d=>s.add(d)));const o=[1,2,3,4,5,6,0].filter(d=>s.has(d));return o.length===7?'Todos los días':o.length===6&&!s.has(0)?'Lunes a sábado':o.map(d=>DL[d]).join(', ')};
 const svc=(s,i)=>`<div class="sc rv"><div class="t"><span class="e">${esc(s.e)}</span><div><h3>${esc(s.n)}</h3>${s.m?`<small>⏱️ ${s.m} min</small>`:''}</div></div>${s.d?`<p>${esc(s.d)}</p>`:''}</div>`;
 const brb=p=>`<div class="bc rv"><div class="ph" style="--c:${esc(p.color||'#333')}">${p.foto?`<img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.remove()">`:''}${esc(ini(p.n))}</div><div class="bd"><h3>${mk(p.n)}</h3>${p.esp?`<p>${esc(p.esp)}</p>`:''}<div class="dias">${[1,2,3,4,5,6,0].map(d=>`<span class="${(p.dias||[1,2,3,4,5,6]).includes(d)?'on':''}">${DN[d]}</span>`).join('')}</div><p style="font-size:13px">${h12(p.desde||'10:00')} a ${h12(p.hasta||'20:00')}</p>${ahora(p)?'<span class="pill ok">● Atendiendo ahora</span>':hoyAt(p)?'<span class="pill">Hoy atiende</span>':'<span class="pill">Hoy descansa</span>'}</div></div>`;
 const appB=()=>`<div class="app rv"><div style="position:relative"><span class="eyb">Mi Xyro</span><h2>${esc(D.appT||'Reserva tu corte en Mi Xyro')}</h2><p style="color:#d9d5cd;margin-top:8px">${esc(D.appX||'Elige servicio, barbero y una hora libre. Llegas y te sientas, sin esperar.')}</p>
  <ul><li>✂️ Ves solo las horas libres de tu barbero</li><li>⭐ Juntas sellos y ganas cortes gratis</li><li>🎁 Promos solo para quienes nos guardan</li></ul>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-p" href="${esc(APP)}">📱 Abrir Mi Xyro</a><a class="btn btn-o" target="_blank" rel="noopener" href="${wa('Hola '+NL+', quiero información 🙂')}">💬 Pedir información</a></div></div>
  <div class="qr" id="qrw"><small>Cargando QR…</small></div></div>`;
 const V={
  inicio:()=>`<section class="hero" style="padding-top:40px"><div class="bg"><img src="${esc(IMG.hero)}" alt="" onerror="this.remove()"></div><i class="pole" aria-hidden="true"></i><div class="w">${live}<span class="eyb" style="display:block">Barbería${D.distrito?' · '+mk(D.distrito):''}${D.anios?' · '+esc(D.anios)+' años cortando':''}</span>
    <h1>${esc(D.hero||'Tu estilo,')}<em>${esc(D.lema||'bien hecho.')}</em></h1><p class="sub">${esc(D.sub||'Cortes clásicos y modernos, fades limpios y barba con toalla caliente. Reserva en Mi Xyro y te atendemos a tu hora.')}</p>
    <div class="ac"><a class="btn btn-p" href="#/reservar">📱 Reservar mi hora</a><a class="btn" href="#/servicios">✂️ Ver servicios</a></div></div></section>
   <div class="tape"><div>${[0,1].map(()=>S.map(s=>`<span>${esc(s.n)}</span><b>✦</b>`).join('')).join('')}</div></div>
   ${SEC('serv')?`<section><div class="w"><div class="hd"><div><span class="eyb">Lo que hacemos</span><h2>Servicios</h2></div><a class="btn" href="#/servicios">Ver todos →</a></div><div class="sv">${S.slice(0,4).map(svc).join('')}</div></div></section>`:''}
   ${SEC('gal')&&IMG.gal.length?`<section style="padding-top:0"><div class="w"><div class="hd"><div><span class="eyb">Nuestro trabajo</span><h2>Cortes de la casa</h2></div></div><div class="gal">${IMG.gal.slice(0,5).map(u=>`<div class="rv"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>`).join('')}</div></div></section>`:''}
   ${SEC('equipo')?`<section style="padding-top:0"><div class="w"><div class="hd"><div><span class="eyb">El equipo</span><h2>Barberos</h2></div><a class="btn" href="#/barberos">Ver horarios →</a></div><div class="bs">${P.slice(0,3).map(brb).join('')}</div></div></section>`:''}
   ${SEC('app')?`<section style="padding-top:0"><div class="w">${appB()}</div></section>`:''}`,
  servicios:()=>`<section><div class="w"><div class="hd"><div><span class="eyb">${S.length} servicios</span><h2>Servicios</h2></div></div><div class="sv">${S.map(svc).join('')}</div>
   <div class="card rv" style="margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between"><p>¿Te gustó alguno? Resérvalo en Mi Xyro con tu barbero favorito.</p><a class="btn btn-p" href="#/reservar">📱 Reservar</a></div></div></section>`,
  barberos:()=>`<section><div class="w"><div class="hd"><div><span class="eyb">${diasTxt()} · ${rango()}</span><h2>Barberos</h2></div></div><div class="bs">${P.map(brb).join('')}</div></div></section>`,
  reservar:()=>`<section><div class="w"><div class="hd"><div><span class="eyb">Sin esperar</span><h2>Reserva en Mi Xyro</h2></div></div>${appB()}
   <div class="steps"><div class="rv"><b>1</b><h3>Escanea o toca</h3><p style="color:var(--mu)">Abre Mi Xyro con el QR y guárdanos.</p></div><div class="rv"><b>2</b><h3>Elige</h3><p style="color:var(--mu)">Servicio, barbero y una hora libre.</p></div><div class="rv"><b>3</b><h3>Llega y siéntate</h3><p style="color:var(--mu)">Te confirmamos ahí mismo. Juntas sellos con cada corte.</p></div></div></div></section>`,
  local:()=>`<section><div class="w"><div class="hd"><div><span class="eyb">Te esperamos</span><h2>Horario y local</h2></div></div><div class="two">
   <div class="card rv"><h3>🕒 Horario</h3><ul><li><b>${diasTxt()}</b></li><li>${rango()}</li></ul><p style="margin-top:10px">${live}</p>
    <h3 style="margin-top:18px">💳 Medios de pago</h3><div class="chips">${(D.pagos||[]).map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>
   ${D.sedes.map(s=>{const real=s.direccion&&!/\(dirección\)/.test(s.direccion);return`<div class="card rv"><h3>📍 ${mk(s.nombre||'Local')}</h3><p style="color:#d9d5cd">${mk(s.direccion||'')}</p>${real?`<iframe class="map" loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(s.direccion+(s.distrito?', '+s.distrito:''))}&z=16&output=embed" title="Mapa"></iframe><a class="btn" style="margin-top:12px" target="_blank" rel="noopener" href="${esc(/^https:/.test(s.maps||'')?s.maps:'https://maps.google.com/?q='+encodeURIComponent(s.direccion))}">🧭 Cómo llegar</a>`:''}</div>`}).join('')}
   </div></div></section>`
 };
 async function qrPinta(){const el=$('#qrw');if(!el)return;try{if(!window.qrcode)await new Promise((ok,ko)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';t.onload=ok;t.onerror=ko;document.head.appendChild(t)});
  const q=qrcode(0,'M');q.addData(APP);q.make();el.innerHTML=q.createSvgTag({cellSize:5,margin:2,scalable:true})+'<small>Escanéalo y reserva en '+esc(NL)+'</small>'}catch(_){el.innerHTML='<a class="btn btn-p" href="'+esc(APP)+'">Abrir Mi Xyro</a>'}}
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
 const ind=()=>{const a=$('#tabs a.on'),i=$('#ind');if(!a){i.style.width='0';return}i.style.width=a.offsetWidth+'px';i.style.transform='translateX('+a.offsetLeft+'px)'};
 const render=()=>{const r=(location.hash.match(/^#\/(\w+)/)||[])[1]||'inicio',k=V[r]?r:'inicio';document.body.dataset.r=k;
  $('#app').innerHTML=V[k]();scrollTo({top:0,behavior:'instant'});$$('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===k));ind();
  $$('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4)*.07+'s';io.observe(el)});qrPinta()};
 addEventListener('hashchange',render);addEventListener('resize',ind);render();
});
})();
</script>
</body>
</html>
