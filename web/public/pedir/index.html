 sel=sel||[];const op=opc(p,sel),k=id+(op.t?'|'+op.t:'');
 const i=d>0?CART.find(x=>x.k===k):CART.filter(x=>x.id===id).pop();if(i){i.c=Math.min(20,i.c+d);if(i.c<=0)CART=CART.filter(x=>x!==i)}else if(d>0)CART.push({k,id,o:sel.slice(),n:p.nombre+(op.t?' · '+op.t:''),p:+p.precio+op.x,e:p.emoji,c:1});

function carrito(){const o=document.createElement('div');o.className='ov';
 const draw=()=>{if(!CART.length){o.remove();pinta();return}

  <input id="nm" maxlength="60" placeholder="Tu nombre (para llevártelo a la mesa)" value="${esc(ls.g('xp-nom','')||M.yo||'')}">

  o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=CART.find(x=>x.k===b.dataset.a);i.c=Math.min(20,i.c+1);guarda();keep(draw)});

 const keep=f=>{const a=o.querySelector('#nm').value,b=o.querySelector('#nt').value;f();const x=o.querySelector('#nm'),y=o.querySelector('#nt');x&&(x.value=a);y&&(y.value=b)};
 o.onclick=e=>{if(e.target===o||e.target.closest('[data-x]')){o.remove();pinta()}};

 async function enviar(){if(ENV)return;const b=o.querySelector('#go'),nm=o.querySelector('#nm').value.trim(),nt=o.querySelector('#nt').value.trim();ENV=true;b.disabled=true;b.textContent='Enviando…';
  try{const q={p_slug:SLUG,p_mesa:M.mesa,p_items:CART.map(i=>i.o&&i.o.length?{id:i.id,c:i.c,o:i.o}:{id:i.id,c:i.c}),p_nombre:nm||null,p_nota:nt||null,p_token:TOK};
   if(M.geo){b.textContent='📍 Confirmando que estás en el local…';const g=await donde();Object.assign(q,{p_lat:g.latitude,p_lng:g.longitude,p_acc:Math.round(g.accuracy||0)});b.textContent='Enviando…'}
   const r=await api('xa_mesa_pedir',q);
   if(nm)ls.s('xp-nom',nm);CART=[];guarda();o.remove();MIOS.unshift(r);confeti();toast('🎉 ¡Pedido enviado! Te avisamos aquí');pinta();scrollTo({top:0,behavior:'smooth'})}
  catch(e){if(e.message==='lejos'||e.message==='ubicacion'){geoAviso(e.message)}else if(e.message==='cerrado'){M.abierto=false;o.remove();pinta();toast('Ahora no recibimos pedidos')}else{toast(e.message);if(/acabó|disponible/i.test(e.message))try{M=Object.assign(M,await api('xa_mesa_menu',{p_slug:SLUG,p_mesa:MESA}))}catch(_){}}

let MV=null;const cargaMV=()=>MV||(MV=new Promise((ok,ko)=>{const x=document.createElement('script');x.type='module';x.src='https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js';x.onload=ok;x.onerror=()=>{MV=null;ko()};document.head.appendChild(x)}));
async function verAR(p){const o=document.createElement('div');o.className='ov arv';const u=new URL(p.modelo,location.href).href;
 o.innerHTML=`<div class="arw"><div class="arh"><div><span class="eb" style="color:var(--a)">Realidad aumentada</span><h2>${esc(p.nombre)}</h2></div><button class="xb" style="position:static" data-x aria-label="Cerrar">✕</button></div>
